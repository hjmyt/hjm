<figure><a href="../assets/chronicle/personal/sy_i2-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/sy_i2-bf202610.webp" alt="sy_i2"></a><figcaption>宝石突然从门后探出半个脑袋围观。十元头也不抬：「宝石，V 我 50——帮我占卜一下考试运。」 宝石盯着自己的手机看了三秒，肉痛地转了 25 块：「……V 你 25。铁公鸡，也要讲基本法。」 钱还没捂热，他转身就跑，跑之前还顺走了你的半包饼干。十元对着他的背影喊…<small>sy_i2 · 母图 bf-01-202610 第 1 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/sy_i3-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/sy_i3-bf202610.webp" alt="sy_i3"></a><figcaption>复习的第三个晚上，琴房热闹了起来：雪子拎着奶茶来探班，飞鸿来喊宝石对歌，REK 把贝斯搬回来说是「补上次那场演出」。 十元被挤在谱架前继续背题，雪子把吸管插好递到她嘴边，宝石和飞鸿为一小节和声争得面红耳赤。你看着这一屋子人，忽然觉得——她想要的乐团，大概就是这…<small>sy_i3 · 母图 bf-01-202610 第 2 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_00-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_00-bf202610.webp" alt="cp_00"></a><figcaption>山丘的驻唱计划定下来了——每晚九点到十一点，两把吉他，一支话筒。 驻唱的是两个人：飞鸿，高音能唱到 High C 的小镇青年；宝石，天然呆主唱，少年音干净得像山泉。他们搭档了小半年，好得像一个人。 （凑到你耳边，压低声音：）「驻唱的这两个，你不觉得……」她话说…<small>cp_00 · 母图 bf-01-202610 第 3 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_00b-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_00b-bf202610.webp" alt="cp_00b"></a><figcaption>山丘吧台邀请入团：十元短棕bob星星发夹米白开衫坐在左边，黑衬衫宝石在中央眼睛发亮看向右边飞鸿；白外衫黑T眼镜的飞鸿侧脸认真点头。三人的完整头发和面孔均在格子中央80%，镜头退远，不要把飞鸿切在右边界。<small>cp_00b · 母图 bf-17-202610 第 3 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_01-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_01-bf202610.webp" alt="cp_01"></a><figcaption>你很快发现，飞鸿对宝石的态度很奇怪。他总在观察宝石——点单时故意报错、排练时故意出错，像在测试什么。 某天后台，你终于问出口。飞鸿压低声音，一脸「我早看穿了」的表情： 「你不觉得吗？他那个天然呆，是装的。这世上哪有二十多岁还这么单纯的人？我试探他半个月了——白…<small>cp_01 · 母图 bf-01-202610 第 5 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_01b-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_01b-bf202610.webp" alt="cp_01b"></a><figcaption>那晚收工，你亲眼目睹了史上最强翻车现场：宝石把飞鸿故意报错的三杯饮品，原封不动按「错」的拿了，还认真地说：「你要的半糖去冰，我没记错呀。」 （端着那杯错误的饮品，僵在原地，声音越来越小：）「……他连『将计就计』都不会吗。」他咬了咬牙，「长这么大，第一次见到这么…<small>cp_01b · 母图 bf-01-202610 第 6 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_01c-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_01c-bf202610.webp" alt="cp_01c"></a><figcaption>你选择了站在飞鸿这边。于是你们俩组了「反宝石白切黑联盟」，设计了更精密的测试。结果一个都没用——宝石每次都认真地掉进陷阱里，还担心你们摔得疼不疼。 一个月后联盟自动解散。飞鸿退盟那天说：「我认输。他不是装的，他是真的。」说完这句话，他自己愣了很久，像是在消化什…<small>cp_01c · 母图 bf-01-202610 第 7 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_00c-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_00c-bf202610.webp" alt="cp_00c"></a><figcaption>演出后台，短黑发黑开领衬衫项链的大羊（参考3，头发不及耳下）抱着原声吉他质问；戴眼镜白外衫的飞鸿上前挡在黑衬衫宝石前面冷静解释。三人头部完整，雪子不在场。大羊绝不画成长发、马尾或配眼镜。<small>cp_00c · 母图 bf-18-qa-202610 第 1 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_02-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_02-bf202610.webp" alt="cp_02"></a><figcaption>相处久了，你发现宝石有个习惯：无论吃什么，都偷偷留一口给飞鸿。烤红薯留最甜的尖，盒饭里的鸡腿永远完整——他藏得很拙劣，飞鸿每次都「恰好」发现。 宝石出了名地抠。团员 AA 他精确到毛，奶茶只蹭别人的。可那天飞鸿随口开了句玩笑：「宝石，赚了钱也不请兄弟吃一顿？」…<small>cp_02 · 母图 bf-02-202610 第 1 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_03x-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_03x-bf202610.webp" alt="cp_03x"></a><figcaption>那晚吃到最后，飞鸿随口问起宝石家里是做什么的——他一直以为，宝石是哪个富家公子哥出来体验生活。宝石的叉子停了停，难得地安静了几秒。 （欲言又止，最后还是说了。语气还是平时那副没心没肺的调子，只是慢了些：）「我不是什么公子哥。我是跟奶奶长大的。」他戳了戳盘子里的…<small>cp_03x · 母图 bf-02-202610 第 2 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_03-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_03-bf202610.webp" alt="cp_03"></a><figcaption>那顿饭之后，飞鸿对宝石更好了——好得不动声色。上台前的柠檬水永远温度刚好，定曲子的时候永远提前扒好调，和声永远垫在主音下面三度，恰到好处，从不喧宾夺主。 有天深夜你在山丘收东西，撞见飞鸿一个人对着手机傻笑。你凑过去一看——相册里全是宝石：唱歌的、发呆的、啃苹果…<small>cp_03 · 母图 bf-02-202610 第 3 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_03b-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_03b-bf202610.webp" alt="cp_03b"></a><figcaption>飞鸿（不是宝石）在台边摆弄吉他弦，谈起心疼一个人，然后抱着吉他上台，和声温柔。（被你噎了一下，却没反驳。他低头摆弄了一会儿吉他弦，忽然说：）「你说，一个人要是开始心疼另一个人——是不是就不对劲了？」 他没有等你回答，抱起吉他上了台。那晚他的和声比任何一次都温柔…<small>cp_03b · 母图 bf-02-202610 第 4 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_04-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_04-bf202610.webp" alt="cp_04"></a><figcaption>要说宝石和飞鸿的搭档里缺了谁都不行，那一定是雪子——长发，键盘手，山丘的常客。他最初只是个粉丝，场场演出不落，后来混成了工作人员，再后来，干脆自己上了台。 三个人成了铁三角：宝石唱，飞鸿和声，雪子的键盘把两个人的声音缝在一起。团员打趣他们是「山丘三宝」，雪子总…<small>cp_04 · 母图 bf-02-202610 第 5 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_04talk-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_04talk-bf202610.webp" alt="cp_04talk"></a><figcaption>雪子独自站在键盘旁背好键盘包，长黑发束脑后，黑色层叠穿搭，微笑向画外第一人称玩家说话。只有雪子，不画固定玩家头或身体，不画其他角色。<small>cp_04talk · 母图 bf-18-qa-202610 第 6 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_05-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_05-bf202610.webp" alt="cp_05"></a><figcaption>后台走廊，前景飞鸿白外衫黑T眼镜靠墙郁闷地扶额；远处雪子（长黑发束脑后黑层叠衣）蹲下帮站着的宝石（黑衬衫）系鞋带。画面动作完整自然，不画玩家面孔，无浮空手脚。<small>cp_05 · 母图 bf-17-202610 第 8 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_06-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_06-bf202610.webp" alt="cp_06"></a><figcaption>团建巴士去程，宝石黑衬衫坐在靠窗座位，刚上车的长发男性雪子在旁边座位坐下；飞鸿白外衫黑T眼镜在过道停住，手停在半空。宝石清醒且没有披蓝色衣服，三个人中景头部完整。<small>cp_06 · 母图 bf-17-202610 第 4 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_07-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_07-bf202610.webp" alt="cp_07"></a><figcaption>歌友会大获成功。散场后十元提议去坐摩天轮，说要「团建收尾」。然后她拉着你和众人，在轿厢分配上做了这辈子最精彩的一次调度——宝石和飞鸿，单独一个轿厢。 你隔着玻璃看见：小小的轿厢里，宝石贴着窗看夜景，飞鸿看着他。城市的灯一点点升上来，落到两个人的眼睛里。 下来的…<small>cp_07 · 母图 bf-03-202610 第 1 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_08-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_08-bf202610.webp" alt="cp_08"></a><figcaption>歌友会之后，飞鸿变得很奇怪。他排练老走神，看宝石的眼神像看一道解不出来的和弦。周四深夜，他把你约到山丘后门，抽了半根烟——他不会抽，呛得直咳嗽。 （终于开口：）「我受不了了。」他盯着自己的鞋尖，「雪子天天在他旁边，他还傻乎乎地什么都感觉不到。我……我想跟他挑明…<small>cp_08 · 母图 bf-03-202610 第 2 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_08b-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_08b-bf202610.webp" alt="cp_08b"></a><figcaption>飞鸿深吸一口气，点了点头：「那我就说了。输也输个明白。」 他转身要走，又回头，很认真地补了一句：「到时候不管成不成，都谢谢你——这段时间，全团就你在真心帮我们。」<small>cp_08b · 母图 bf-03-202610 第 3 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_08c-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_08c-bf202610.webp" alt="cp_08c"></a><figcaption>飞鸿沉默了。他把那根没抽完的烟摁灭，笑了笑：「也是。他那种性格，万一被吓跑了……」 「再等等吧。」他说。可你听得出来，这个「等」字，每说一次就更薄一层。<small>cp_08c · 母图 bf-03-202610 第 4 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_09-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_09-bf202610.webp" alt="cp_09"></a><figcaption>周五演出后，飞鸿把宝石约到了天台。你躲在楼梯间，掐着大旗值偷听。 （他的声音在抖，却还在笑：）「宝石，我跟你说件事。我……我可能，不止想当朋友。」 （长久的沉默。然后是他一贯清澈的声音，认认真真：）「飞鸿，你当然不只是朋友呀。你是我最重要的搭档。」 （他又想了…<small>cp_09 · 母图 bf-03-202610 第 5 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_10-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_10-bf202610.webp" alt="cp_10"></a><figcaption>离开山丘：只画飞鸿白外衫黑T银链眼镜，一个人在房间里收拾敞开的行李箱，神情落寞，歌词本放在旁边。不要帽子，不要黑外套，不要其他人物或小窗口叠图。<small>cp_10 · 母图 bf-17-202610 第 5 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_11-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_11-bf202610.webp" alt="cp_11"></a><figcaption>飞鸿走后的第一周，宝石一切如常。第二周，他开始在演出前发呆——柠檬水没人准备了，温度总是不对。 第三周，定新歌的时候，他对着谱子坐了两个小时，才发现没人提前帮他扒好调。第四周，他的和声自己唱，唱到一半忽然停下来：「这个音……以前飞鸿会垫在下面。」 第五周的深夜…<small>cp_11 · 母图 bf-03-202610 第 7 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_12-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_12-bf202610.webp" alt="cp_12"></a><figcaption>第七周，宝石来找你。他把头发抓成了鸟窝，眼睛亮得吓人，像是终于烧穿了某层壳： （他深吸一口气：）「我想到明白是什么了。我要把他追回来。」他顿了顿，声音忽然软下来，「可是……我不知道他还在不在原地。你能帮我吗？」<small>cp_12 · 母图 bf-03-202610 第 8 格</small></figcaption></figure>
<figure><a href="../assets/chronicle/personal/cp_12b-bf202610.webp" target="_blank"><img loading="lazy" src="../assets/chronicle/personal/cp_12b-bf202610.webp" alt="cp_12b"></a><figcaption>宝石在山丘门口得到追人的消息后高兴地跑向门外，黑衬衫衣角扬起，回身向画外玩家挥手，充满期待。只有宝石一人，不能画十元或女玩家，完整中景头部有余量。<small>cp_12b · 母图 bf-17-202610 第 6 格</small></figcaption></figure>
