【q_start｜序 · 山丘的午后】
旁白：你加入哈基米也快一年了。
旁白：从最初的成人兴趣小组开始，到注册公司。你在哈基米有了一席之地。
旁白：你参与了一次次排练，一场又一场的演出。不知不觉走了那么远的路。
旁白：从最开始上台会兴奋出汗，到现在似乎也习惯了。
旁白：但你总觉得，路好像越走越窄。
旁白：山丘酒馆的招牌掉了一个字，现在叫"山丘酉馆"。朱老师说凑活着用，等有钱了再换新的。这一等就是八个月。
旁白：屋里坐着七个人。朱老师、十元、柒柒、冰冰、小塔、叶思阳、垃垃。还有你。
旁白：阿喆蹲在门口洗水果。他从不参与讨论，但什么都看在眼里。
旁白：空格靠在墙角，手里转着一根指挥棒。他是乐团首席，技术标杆。谁上台solo，他说了算。
旁白：角落里还坐着一个人。穿格子衬衫，戴黑框眼镜，手指在桌上敲着钢琴键的节拍。那是小周。没人请他，他自己来的。
旁白：朱老师的音乐剧《拾光》上个月首演成功了。但首演成功离真正商业化，还差十万八千里。没有宣发预算，没有巡演渠道，没有固定班底。演了一场，下一场在哪都不知道。
旁白：山丘的生意也一样。白天卖咖啡，晚上卖酒，收支勉强打平。十元的账本最后一行永远是红色。
柒柒：「朱老师，猫网联动的路演我谈下来了。没演出费，只有两千块餐饮券。」
十元：「演出费呢？」
柒柒：「周总的面子。爱要不要。」
小塔：「柒柒姐，周总谁啊？你男朋友？」
柒柒：（瞪了他一眼：）「客户。」
叶思阳：（调着弦：）「柒柒姐今天眼线画得真好。」
垃垃：（数着名单：）「六家投资机构，联系方式都是空的。」
空格：（转着指挥棒：）「路演谁solo？我考核过了吗？」
小周：（敲着桌面：）「我去。这剧团连个固定钢琴都没有？」
选项：
- 「柒柒，这些机构你联系过吗？」（记住q01）（去q01）
- 「先准备路演吧。」（去q02）

【q01｜副场景｜壹 · 路演前】
柒柒：（笑：）「联系了。都说没兴趣。」
冰冰：（没抬头：）「是吗？我上周刚投了一家，对方说欢迎新人。」
柒柒：（脸色变了：）「你投的是哪家？」
冰冰：（笑：）「你名单上第一家。」
旁白：屋里安静了。
小塔：（敲鼓：）「我去。打脸了。」
十元：（合上账本：）「柒柒，到底怎么回事？」
叶思阳：（拉了一个长音：）「别急，听听柒柒姐怎么说。」
阿喆：（在门口：）「圣女果要吗？」
选项：
- 「柒柒，你故意的吧？」（记住q01b）（去q02）
- 「可能真没联系上。」（记住q01a）（去q02）

【q02｜壹 · 路演现场】
旁白：路演在猫网科技的员工食堂举办。舞台是临时搭的，灯光只有两盏追光。第一排坐着几个穿格子衫的程序员，正在低头刷手机。
旁白：柒柒带来的三个姑娘占了最前排，手机支架支得像一排枪口。
旁白：冰冰穿着珍珠白的裙子，站在舞台中央。小提琴靠在肩上，琴弓悬在半空。
旁白：solo刚起，麦断了。冰冰的弦音戛然而止。
旁白：全场哗然。程序员们抬起头。
旁白：侧门站着一个西装男人，冲柒柒点头。
旁白：柒柒走上台，拿起麦。她今天换了条新旗袍，暗红色，盘扣上缀着水钻。
柒柒：「各位好，我是柒柒。今天这段小提琴solo，本来是我的。冰冰临时身体不适，我替她。」
旁白：冰冰站在侧幕，手指攥着琴弓，指节发白。她没说话。
旁白：十元冲向后台。小塔拦住她。
小塔：「别去。看看她想干什么。」
旁白：空格从侧幕走出来，手里拿着一根指挥棒。他看了柒柒一眼，又看了冰冰一眼。
空格：（声音很平：）「柒柒，这段solo我没考核过你。按规定，你不能上。」
旁白：柒柒笑了一下。
柒柒：（对着麦：）「空格首席，规矩是死的，人是活的。观众等着呢。」
旁白：她转向观众。
柒柒：「我给大家拉一段《拾光》的主题曲。曲是朱老师谱的，我填的词——」
旁白：台下突然传来一个声音。
小周：（坐在第一排，翘着二郎腿：）「等等。这曲子我听过。」他笑了一下，「上个月，在周氏剧场的内部试听会上。名字叫《山丘之外》，作者署名——」他顿了顿，「周总。」
旁白：全场安静。柒柒的脸色变了一瞬。
叶思阳：（攥着琴弓：）「弓被人做了手脚。弓毛上缠了胶。」
冰冰：（站在侧幕，没动：）「让她演。我倒要看看，她能演多久。」
垃垃：（拿着手机：）「我录下来了。」
选项：
- 去后台查设备（去q_backstage）
- 留在观众席（去q_bingbing）
- 冲上台（去q_after_show）

【q_backstage｜副场景｜后台】
旁白：后台很暗。阿喆蹲在地上，面前摆着一盒圣女果。
阿喆：「线是我看着拔的。」
阿喆：「穿旗袍。高跟鞋。珍珠盘扣。」
阿喆：（递给你一张纸：）「这是周总的名片。我捡的。」
旁白：名片背面写着一行字：「版权到手，五十万。」
旁白：门外传来柒柒的声音：「周总，晚上包间我定好了。」
选项：
- 「你早就知道？」（记住azRoad）（去q_after_show）
- 「为什么不早说？」（去q_after_show）

【q_bingbing｜壹 · 冰冰】
旁白：冰冰站在侧幕，手里攥着断弓。
旁白：柒柒走下台，经过她身边。
柒柒：（很轻：）「周总让我转告你，错过一次，就没有下次了。」
冰冰：（笑：）「他不敢自己跟我说？」
旁白：柒柒脸色变了一瞬。
十元：（跑过来：）「换好麦了。下半场继续。」
冰冰：（把弓递给十元：）「不用。让柒柒姐来。她更需要舞台。」
小塔：（在后台喊：）「冰冰，别怂啊！」
叶思阳：（轻声：）「小塔，闭嘴。」
垃垃：（举起手机：）「证据我存好了。」
选项：
- 追冰冰（记住q_bingbing）（去q_backstage_fight）
- 帮冰冰捡弓（去q_after_show）

【q_backstage_fight｜壹 · 后台 · 两个女人】
旁白：化妆间。冰冰卸耳环。柒柒推门进来。
柒柒：「你今天真大度。」
冰冰：（没转身：）「我妈说，会乐器的女孩看起来无害。」
旁白：冰冰站起来，转身。
冰冰：（掏出一张纸：）「周总的投资意向书。担保人是我。但我不记得签过。」
柒柒：（声音紧了：）「你想怎样？」
冰冰：（把纸收回包里：）「不想怎样。只是想告诉你——」
旁白：门外传来脚步声。十元喊：「庆功宴开始了！」
冰冰：（经过柒柒身边：）「观众记住的，永远是被欺负的公主。」
旁白：她推门出去。
旁白：阿喆从走廊路过，看了里面一眼，没说话。
选项：
- 走进去（记住q_bingbing）（去q_after_show）
- 悄悄离开（去q_after_show）

【q_after_show｜壹 · 庆功宴】
旁白：包间里。柒柒坐在周总旁边，身姿窈窕。
十元：（把账本放桌上：）「餐饮券明细。剩余四百六十二块。」
旁白：柒柒端起红酒杯——
旁白：冰冰按住她的手腕。
冰冰：「手滑了就不好看了。」
柒柒：（放下杯子：）「冰冰，你真贴心。」
旁白：周总看了冰冰一眼。
周总：「上次说想听小提琴solo，今天可惜了。」
冰冰：（看着柒柒：）「弓被人做了手脚。弓毛上全是胶。」
旁白：全场安静。
小塔：（鼓槌敲桌：）「这瓜保熟吗？」
叶思阳：（拉他袖子：）「闭嘴。」
垃垃：（睁大眼：）「我手机里有视频。」
柒柒：（笑：）「冰冰，你说什么？我听不懂。」
冰冰：（站起来：）「听不懂没关系。」
冰冰：（经过你身边：）「你也看见了，对吗？」
选项：
- 追冰冰（记住q02a）（去q03）
- 盯着柒柒（记住q02b）（去q03）

【q03｜副场景｜壹 · 后台的柒柒】
旁白：柒柒补眼线。墨痕很深。
柒柒：「冰冰走了？」
旁白：你没说话。
柒柒：（冷笑：）「她演得真好。被欺负的公主。」
柒柒：（站起来：）「但她不是公主。她是周总的担保人。她早就入局了。」
旁白：你愣了。
柒柒：（笑：）「惊讶吗？她比我更会躲。」
旁白：阿喆从走廊走过，丢下一句：「门口有只猫，饿坏了。」
选项：
- 「你到底是谁的人？」（记住qSoul1）（去q_cat）
- 「冰冰为什么担保？」（去q_cat）

【q_cat｜副场景｜壹 · 后门的小猫】
旁白：巷子很暗。柒柒蹲着喂猫。
旁白：她没发现你。
柒柒：（很轻：）「你也饿了吧。」
旁白：手机响了。
柒柒：（声音变软：）「版权的事还得等等。朱老师没签字。」
柒柒：（声音变紧：）「冰冰？她知道又怎样。一个拉琴的，能做什么？」
旁白：电话挂了。柒柒把火腿肠扔进垃圾桶。
旁白：巷子那头，一个白影子闪过。
旁白：阿喆靠墙站着，嘴里叼着一根烟。他没点。
阿喆：（看你一眼：）「猫吃饱了。人还没吃饱。」
选项：
- 「版权？什么版权？」（记住qCat）（去q_event2）
- 悄悄退回（去q_event2）

【q_event2｜贰 · 名单】
旁白：七月。朱老师四处化缘。柒柒给了名单，六家机构、两家基金，都"问过了"。
旁白：结果是零。
旁白：垃垃拿着名单看了很久。
垃垃：「奇怪。联系方式一栏是空的。」
柒柒：（倒茶，手停了一下：）「我问过了，没兴趣。就没写。」
十元：（抬头：）「你没写，朱老师就联系不上。」
叶思阳：「柒柒姐人脉真广。」
小塔：（摔鼓槌：）「那三个姑娘，周总的人吧？」
柒柒：（喝茶：）「小塔，你鼓打得不错。但有些事，不是你该管的。」
冰冰：（坐在角落：）「我查了。三家基金上个月刚投了音乐剧。欢迎投递。」
旁白：柒柒的手抖了一下。
阿喆：（洗水果：）「水浑了，鱼才好摸。」
选项：
- 「名单是你故意删的吧？」（记住qClue2）（去q_event2b）
- 「柒柒，你到底想干什么？」（去q_event2b）

【q_event2b｜贰 · 饭局 · 逼宫】
旁白：山丘饭局。柒柒坐在朱老师旁边。
柒柒：（掏出一张纸：）「剧场押金二十万。一周内到账。不然撤档。」
旁白：朱老师手指在数字上停了很久。
旁白：十元伸手拿纸，柒柒按住。
柒柒：「你管钱。但这件事，你管不了。」
柒柒：（对朱老师笑：）「清高不能当饭吃。」
柒柒：（又掏出一张纸：）「周总的投资意向书。三十万，换百分之三十版权。」
旁白：全场安静。
旁白：角落里传来一个声音。
小周：（坐在椅子上，没抬头：）「三十万？周正华出手这么小气？」
小周：（笑：）「他上个月给一个小网红买包，花了四十万。」
旁白：所有人看向他。小周推了推黑框眼镜。
小周：（看柒柒：）「柒柒姐，你是不是被压价了？还是——」他顿了顿，「你吃了回扣？」
旁白：柒柒的手指在桌上收紧。
冰冰：（放下筷子：）「我能看看吗？」
旁白：柒柒推过去。冰冰翻到最后。
冰冰：「担保人是我。但我不记得签过。」
旁白：十元站起来，拿过意向书。
十元：「柒柒，这个签名……是你仿的。」
旁白：小塔鼓槌悬在半空。叶思阳手指收紧。垃垃睁大眼。
柒柒：（笑：）「冰冰，你记错了吧？你那天在周总办公室……」
冰冰：（把纸放回桌上：）「我那天在剧院排练。有监控。」
小塔：（喊：）「我去！实锤了！」
叶思阳：（拉他：）「别吵。」
垃垃：（举起手机：）「监控我可以调。」
旁白：所有人的目光在柒柒和冰冰之间来回。
阿喆：（在门口：）「圣女果还有人要吗？」
选项：
- 「我去下洗手间。」（去q_washroom）
- 「柒柒，这到底怎么回事？」（去q_shanqiu_fight）

【q_shanqiu_fight｜贰 · 山丘 · 公开对峙】
旁白：山丘。所有人都在。
旁白：柒柒站一边。冰冰站另一边。十元在中间。
旁白：朱老师坐在角落，没说话。
柒柒：（声音很紧：）「冰冰，我帮你牵线，你反过来咬我？」
冰冰：（笑：）「咬你？」
冰冰：（掏出手机放桌上：）「周总三个月前问我：'柒柒想借你名字签担保，你同意吗？'我回复：不同意。」
旁白：全场安静。
小塔：（敲鼓：）「我去。这瓜保熟吗？」
叶思阳：（拉他：）「闭嘴。」
柒柒：（脸色发白：）「就算担保是假的，意向书是真的。周总真要给三十万——」
冰冰：（打断：）「周总？」
冰冰：（笑：）「他上个月跟我求婚了。戒指我收了，婚没答应。」
冰冰：（看着柒柒：）「因为我说，等我先处理完山丘的事。」
旁白：柒柒往后退了一步。高跟鞋撞桌腿。
十元：（看两边：）「所以……你们是一伙的？」
冰冰：（看十元：）「不是一伙的。她是周总的刀。我是周总的未婚妻。」
旁白：她转向朱老师。
冰冰：（声音变柔：）「朱老师，周总的钱不干净。但我爸的基金干净。五十万。不要版权。不要担保。」
旁白：她把纸放朱老师面前。
冰冰：（看柒柒：）「你那把火，烧的是山丘。」
旁白：阿喆在门口，把一颗圣女果放进嘴里。
旁白：空格把指挥棒往桌上一放。
空格：（声音很平：）「柒柒，你上次路演上台solo，我拦过你。你说规矩是死的。现在我想问——」他看着柒柒，「你的规矩，是不是只对你们有用？」
旁白：角落里，小周鼓起掌来。
小周：（笑：）「精彩。太精彩了。」
小周：（站起来：）「周正华要是知道，他布的局被你们当成家庭伦理剧演，得气死。」
小周：（看朱老师：）「朱老师，你知道周正华为什么选柒柒吗？不是因为漂亮。是因为她够蠢，好控制。」
小周：（看冰冰：）「选你呢？是因为你够狠，能帮他在圈子里开路。」
旁白：他笑了一下。
小周：（看所有人：）「而我呢？我是来捣乱的。因为周正华欠我的，我就要让他所有的事，都成不了。」
选项：
- 站冰冰这边（记住unity+10）（去q_washroom）
- 站柒柒这边（去q_washroom）

<script>
/* ================= 引擎 ================= */
var SAVE_KEY='qiqi_finale_v1';
var WHO={'旁白':'sys','十元':'shiyuan','柒柒':'qiqi','朱老师':'zhu','阿喆':'azhe','叶思阳':'yes','小塔':'xiaota','垃垃':'lala','冰冰':'bingbing','空格':'kongge','小周':'xiaozhou','男生':'nan'};
var NAME={sys:'旁白',shiyuan:'十元',qiqi:'柒柒',zhu:'朱老师',azhe:'阿喆',yes:'叶思阳',xiaota:'小塔',lala:'垃垃',bingbing:'冰冰',kongge:'空格',xiaozhou:'小周',nan:'男生'};
var G={qiqi:0,azhe:0,unity:0,flags:{},done:{}};
function parseScript(txt){
 var raw=txt.split('\n'),blocks=[],cur=[];
 for(var ri=0;ri<raw.length;ri++){var L=raw[ri];
  if(!L.trim()){
   var nxt=null;
   for(var rj=ri+1;rj<raw.length;rj++){if(raw[rj].trim()){nxt=raw[rj].trim();break;}}
   if(nxt&&nxt.charAt(0)==='【'){blocks.push(cur.join('\n'));cur=[];}else cur.push(L);
  }else cur.push(L);
 }
 blocks.push(cur.join('\n'));
 var route=[];
 blocks.forEach(function(b){
  b=b.trim();if(!b)return;
  var lines=b.split('\n'),head=lines[0].match(/^【(.+?)】/);if(!head)return;
  var parts=head[1].split('｜');
  var ev={id:parts[0].trim(),title:(parts[2]||'').trim(),lines:[],choices:null};
  var mode='text';
  for(var i=1;i<lines.length;i++){
   var L=lines[i].trim();if(!L)continue;
   if(L==='选项：'){mode='choice';ev.choices=[];continue;}
   if(mode==='choice'&&L.charAt(0)==='-'){
    var t=L.replace(/^-\s*/,'');var c={t:'',flags:[],next:null};
    while(true){
     var mm=t.match(/（([^（）]*)）\s*$/);if(!mm)break;
     var inner=mm[1].trim(),used=true;
     if(inner.indexOf('记住')===0)c.flags.push(inner.slice(2));
     else if(inner.indexOf('去')===0)c.next=inner.slice(1).trim();
     else used=false;
     if(!used)break;
     t=t.slice(0,mm.index).trim();
    }
    c.t=t;ev.choices.push(c);continue;
   }
   var mi=L.match(/^(.+?)：([\s\S]*)$/);
   if(mi&&WHO[mi[1]])ev.lines.push({who:WHO[mi[1]],text:mi[2]});
  }
  route.push(ev);
 });
 return route;
}
var ROUTE=parseScript(document.getElementById('script').value);
var ENDS={q_badloan:1,q_judge:1,q_pseudoHE_path:1,q_ending:1,q_expose_bad:1,q_event3_alone:1};
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(G));}
function load(){var s=localStorage.getItem(SAVE_KEY);if(s){try{var o=JSON.parse(s);if(o&&typeof o.done==='object'){G=o;return true;}}catch(e){}}return false;}
var el=function(id){return document.getElementById(id)};
function hud(){
 var h='<span>团结度 '+G.unity+'</span>';
 var clues=(G.flags.qClue1?1:0)+(G.flags.qClue2?1:0)+(G.flags.qClue3?1:0);
 if(clues)h+='<span>证据 '+clues+'/3</span>';
 el('hud').innerHTML=h;
}
function render(ev){hud();G.cur=ev.id;save();
 var m='<div class="panel">';
 if(ev.title)m+='<div class="ins" style="margin-top:0">'+ev.title+'</div>';
 ev.lines.forEach(function(l){m+='<div class="who">'+NAME[l.who]+'</div><div class="txt">'+l.text+'</div>';});
 if(ev.choices)ev.choices.forEach(function(c,i){m+='<button class="btn" onclick="pick('+i+')">'+c.t+'</button>';});
 else m+='<button class="btn" onclick="pick(0)">（继续）</button>';
 m+='</div>';el('main').innerHTML=m;el('main')._ev=ev;}
function applyC(c){
 c.flags.forEach(function(f){
  if(f.indexOf('unity')===0){G.unity+=parseInt(f.slice(5))||0;return;}
  G.flags[f]=1;
  if(f==='q01'||f==='q01a')G.qiqi+=2;
  if(f==='q01b')G.qiqi+=5;
  if(f==='q02a')G.qiqi+=3;
  if(f==='q02b')G.qiqi+=1;
  if(f==='qSoul1')G.qiqi+=8;
  if(f==='qSoul2')G.qiqi+=10;
  if(f==='qSoul3')G.qiqi+=12;
  if(f==='qSoul4')G.qiqi+=15;
  if(f==='azRoad')G.azhe+=1;
  if(f==='qExpose')G.qiqi+=5;
  if(f==='qClue1'||f==='qClue2'||f==='qClue3')G.qiqi+=5;
  if(f==='redeemed')G.qiqi+=20;
 });
}
function pick(i){G.done[G.cur]=1;var ev=el('main')._ev;
 var c=ev.choices?ev.choices[i]:null;
 if(c){applyC(c);
  if(c.next==='IF'){branch();return;}
  if(c.next){var nx=ROUTE.find(function(e){return e.id===c.next;});if(nx){render(nx);return;}}}
 if(ENDS[G.cur]){G.flags._ended=1;save();el('main').innerHTML='<div class="panel"><div class="end">—— 第一季 · 已完结 ——</div><button class="btn pri" onclick="if(confirm(\'清空存档、从头开始？\')){localStorage.removeItem(SAVE_KEY);location.reload();}">重新开始</button></div>';return;}
 var nx=ROUTE.find(function(e){return e.id===G.cur+'_next';});
 if(nx){render(nx);return;}
 el('main').innerHTML='<div class="panel"><div class="end">—— 本章结束 ——</div></div>';}
function branch(){
 var hasAll=G.flags.qClue1&&G.flags.qClue2&&G.flags.qClue3;
 var soul=G.flags.qSoul4&&(G.flags.qSoul3&&G.flags.qSoul2&&G.flags.qSoul1);
 var nx;
 if(!hasAll){nx='q_judge';}
 else if(hasAll&&!soul){nx='q_pseudoHE_path';}
 else{nx='q_redeem_trigger';}
 var e=ROUTE.find(function(x){return x.id===nx;});if(e)render(e);
}
window.onload=function(){load();
 if(G.flags&&G.flags._ended){localStorage.removeItem(SAVE_KEY);G={qiqi:0,azhe:0,unity:0,flags:{},done:{}};}
 if(typeof G.unity==='undefined')G.unity=0;
 hud();render(ROUTE[0]);};
window.pick=pick;window.G=G;
</script>
