【cp_00｜大旗10｜入线 · 山丘的驻唱】
旁白：山丘的驻唱计划定下来了——每晚九点到十一点，两把吉他，一支话筒。

旁白：驻唱的是两个人：飞鸿，高音能唱到 High C 的小镇青年；宝石，天然呆主唱，少年音干净得像山泉。他们搭档了小半年，好得像一个人。

十元：（凑到你耳边，压低声音：）「驻唱的这两个，你不觉得……」她话说到一半，自己先笑了，「没什么，当我没说。」
选项：
- 「我懂，我来扛旗。」（大旗+3）
- 「啥？不明所以。」（大旗+1）

【cp_00b｜大旗12｜入队 · 530的邀请】
旁白：宝石和飞鸿本来只是山丘的驻唱。两个人性格单纯，跟十元混得极好——好到十元每次来山丘，都能白蹭一首歌。

十元：（某个晚上，她听完歌，把杯子往桌上一放：）「你俩，来我们乐团吧！」她掰着手指头，「530 专场，就缺一个干净的主唱，和一个不抢戏的和声！」

宝石：（眼睛一亮，转头看飞鸿：）「去吗去吗？」

飞鸿：（看着那双亮晶晶的眼睛，把「再想想」咽了回去：）「……去。」

旁白：很多年后你才知道，这一个「去」字，把两个人的命运拧在了一起。当然，彼时的他们都以为，只是去唱一场演出。
选项：
- 默默扫码预约530观众席位（大旗+2）

【cp_01｜大旗15｜相熟 · 白切黑计划】
旁白：你很快发现，飞鸿对宝石的态度很奇怪。他总在观察宝石——点单时故意报错、排练时故意出错，像在测试什么。

旁白：某天后台，你终于问出口。飞鸿压低声音，一脸「我早看穿了」的表情：

飞鸿：「你不觉得吗？他那个天然呆，是装的。这世上哪有二十多岁还这么单纯的人？我试探他半个月了——白切黑，绝对是白切黑。」
选项：
- 「赌一顿夜宵，他是真的天然。」（记住push1）（去cp_01b）
- 「你说得对，我也觉得他在装。」（去cp_01c）

【cp_01b｜副场景｜】
旁白：那晚收工，你亲眼目睹了史上最强翻车现场：宝石把飞鸿故意报错的三杯饮品，原封不动按「错」的拿了，还认真地说：「你要的半糖去冰，我没记错呀。」

飞鸿：（端着那杯错误的饮品，僵在原地，声音越来越小：）「……他连『将计就计』都不会吗。」他咬了咬牙，「长这么大，第一次见到这么单纯的人。」

旁白：夜宵你赢了。但飞鸿输得魂不守舍——他嘟囔了一整晚「这么可爱的宝石，想象不到谁会压力他」。
选项：
- 笑而不语，深藏功与名（大旗+3）
- 「飞鸿，你不觉得你太在意宝石了吗？」（记住push1）（大旗+3）
- 「哎哟喂，你俩组上CP了。」（大旗+1）

【cp_01c｜副场景｜】
旁白：你选择了站在飞鸿这边。于是你们俩组了「反宝石白切黑联盟」，设计了更精密的测试。结果一个都没用——宝石每次都认真地掉进陷阱里，还担心你们摔得疼不疼。

旁白：一个月后联盟自动解散。飞鸿退盟那天说：「我认输。他不是装的，他是真的。」说完这句话，他自己愣了很久，像是在消化什么。
选项：
- 联盟解散，各回各家（大旗+1）

【cp_00c｜大旗18｜530 · 被掐掉的SOLO】
旁白：530 专场，后台兵荒马乱。原定流程里有大羊的一段吉他 SOLO——结果宝石天然呆发作，数错了小节，提前开唱，把那段 SOLO 整个「掐」了过去。

大羊：（下台后抱着吉他，阴阳怪气：）「哟，咱们主唱真厉害。三十二个小节的 SOLO，唱两个字就给我掐了。下次要不要我连琴都不用带？」

旁白：宝石还没反应过来这是在说他，认真地点头：「你要不想带，我可以帮你背！」大羊被噎得差点背过气。

飞鸿：（往前一步，挡在宝石前面，声音不大：）「他数错了，是他不对。」他顿了顿，「但刚才台下喊安可的时候，喊的是全团的名字。大羊，你的 SOLO 是亮点，他的嗓音也是。530 不是一个人的专场。」

旁白：大羊张了张嘴，没说出话，甩头走了。宝石从飞鸿身后探出脑袋：「飞鸿，你刚才好帅。」飞鸿的耳根腾地红了：「……闭嘴，背你的词去。」
选项：
- 默默跟着小乐队蹭了一顿宵夜（大旗+3）（记住push1）

【cp_02｜大旗24｜互动 · 铁公鸡请客】
旁白：相处久了，你发现宝石有个习惯：无论吃什么，都偷偷留一口给飞鸿。烤红薯留最甜的尖，盒饭里的鸡腿永远完整——他藏得很拙劣，飞鸿每次都「恰好」发现。

旁白：宝石出了名地抠。团员 AA 他精确到毛，奶茶只蹭别人的。可那天飞鸿随口开了句玩笑：「宝石，赚了钱也不请兄弟吃一顿？」

宝石：（认真想了想，一咬牙：）「请！」

旁白：他真的请了。人均六十的牛排馆，他自己点了最便宜的意面，把牛排推给飞鸿：「这个月……只能请你吃这个了。下个月发了驻唱的钱，再请你吃好的。」
选项：
- 餐厅角落，认出两个熟悉的身影——哎呀这不是宝石飞鸿吗？默默换了张桌子，偷听他们说话（大旗+3）（记住foodShare）

【cp_03x｜大旗26｜心疼 · 牛排与捉迷藏】
旁白：那晚吃到最后，飞鸿随口问起宝石家里是做什么的——他一直以为，宝石是哪个富家公子哥出来体验生活。宝石的叉子停了停，难得地安静了几秒。

宝石：（欲言又止，最后还是说了。语气还是平时那副没心没肺的调子，只是慢了些：）「我不是什么公子哥。我是跟奶奶长大的。」他戳了戳盘子里的意面，「她最近……身体不太好。」

旁白：开朗的眼眸里，落下一丝愁绪。快得像错觉，可你看见飞鸿的手顿在了半空。

旁白：飞鸿忽然觉得，胸口流过一丝异样。他抬手抚住胸口，又觉得这个动作弱弱的，讪讪放下。可这感觉，似曾相识——

旁白：小时候跟伙伴玩捉迷藏，轮到他躲。他找了个最隐蔽的地方，想着谁都找不到自己。一分钟……两分钟……半小时。等他终于按捺不住冲出来，兴奋地大喊「哈哈，你们都输啦」——月光下的操场，一个人都没有了。小伙伴们见找不着他，各自散了。那时候的他心里，就是这种感觉。只是那时的他不明白，原来这种感觉，叫难过。

宝石：（他先开了口，笑嘻嘻地把盘子往前一推：）「哎呀，你别这样。也没啥大不了的。牛排不吃我吃啦？」

旁白：飞鸿第一次没有跟他抢。他只是似笑非笑地看着宝石，把牛排推了回去。

飞鸿：「给你。以后……都给你。」

宝石：（眼睛都亮了：）「真的啊？！哈哈，你说的啊，骗人是小狗！」

旁白：宝石的眼睛本来就有些下垂，这会儿亮晶晶的，像一只比熊。飞鸿觉得自己心跳漏了一拍，随即警铃大作——

旁白：（我别是有病吧。）他面无表情地扒了口意面。（对着个哥们，我心动个屁。）

旁白：彼时的他还不明白，有一种心跳，意味着情谊明媚。只觉得心，有点疼。
选项：
- CP粉泪目——一定要把大旗扛稳（大旗+4）（记住heartStruck）

【cp_03｜大旗28｜相知 · 柠檬水】
旁白：那顿饭之后，飞鸿对宝石更好了——好得不动声色。上台前的柠檬水永远温度刚好，定曲子的时候永远提前扒好调，和声永远垫在主音下面三度，恰到好处，从不喧宾夺主。

旁白：有天深夜你在山丘收东西，撞见飞鸿一个人对着手机傻笑。你凑过去一看——相册里全是宝石：唱歌的、发呆的、啃苹果的、睡着的。

飞鸿：（被发现他也不躲，反而把手机举给你看，理直气壮：）「你们不觉得宝石这样很可爱吗？」他顿了顿，补了一句，「宝石真的好可爱。」

旁白：你正想调侃，他忽然收起手机，望着台上的方向，轻声说：「小镇上出来的人，最怕欠人东西。他对我好一次，我就想还十次。可是越还……越算不清了。」
选项：
- 「那你就别算了。」（大旗+3）（去cp_03b）
- 「你那是想还吗？我都不好意思拆穿你。」（记住push1）（大旗+4）（去cp_03b）

【cp_03b｜副场景｜】
飞鸿：（被你噎了一下，却没反驳。他低头摆弄了一会儿吉他弦，忽然说：）「你说，一个人要是开始心疼另一个人——是不是就不对劲了？」

旁白：他没有等你回答，抱起吉他上了台。那晚他的和声比任何一次都温柔，温柔得不像衬托，像守护。
选项：
- 默默录下了这晚的歌声（大旗+2）

【cp_04｜大旗38｜雪子 · 铁三角】
旁白：要说宝石和飞鸿的搭档里缺了谁都不行，那一定是雪子——长发，键盘手，山丘的常客。他最初只是个粉丝，场场演出不落，后来混成了工作人员，再后来，干脆自己上了台。

旁白：三个人成了铁三角：宝石唱，飞鸿和声，雪子的键盘把两个人的声音缝在一起。团员打趣他们是「山丘三宝」，雪子总是摆摆手：「别，我是来加入这个家的。」

旁白：雪子对宝石的好，大大方方，从不遮掩——可谁都看得出，那是哥们式的好，仗义，坦荡，没有杂质。你一度以为这条线里最大的变量会是他，后来才发现，变量从来只有一个。
选项：
- 去跟雪子谈谈（记住xueziOK）（去cp_04talk）
- 默默观察（大旗+2）

【cp_04talk｜副场景｜雪子言叶】
旁白：散场后，你在后台堵住了雪子。他抱着键盘，长发扎成一束，见你来也不意外。

旁白：你决定贴脸开大：「你是不是喜欢宝石。」

雪子：（他想都没想：）「谁不喜欢宝石呢？」

旁白：「呵呵……」你冷笑了一声，没接话。

雪子：（他沉默了几秒，忽然笑了，看着远处正在收拾话筒的宝石：）「一开始，是有点吧。」他把键盘包背好，语气轻下来，「但是后来我想明白了——太阳照到你，不是真的为你一个人发光。我恰好路过，晒到了，仅此而已。」

雪子：（他转过头看你，眼睛很亮：）「宝石……他不明白这些。所以，别让他输。」
选项：
- （雪子言叶，大旗+3）（记住snowWords）

【cp_05｜大旗48｜非醋 · 鞋带】
旁白：铁三角的默契也有出差错的时候。那天演出前，宝石的鞋带散了，蹲下去系了两次都没系好——雪子看不过去，单膝一蹲，两下给他系了个漂亮的结，还拍了拍他的鞋面：「行了，上台吧。」

旁白：全程不到十秒。全后台没人觉得有问题——除了飞鸿。

旁白：你看见飞鸿盯着那个鞋带结看了三秒，转身进了消防通道。你追过去，他正对着墙，拿额头轻轻磕着墙皮，念念有词：

飞鸿：「我去，都是哥们，你不爽个屁。」他磕了一下，又补一句，「人家帮忙系个鞋带，你在这演什么内心戏。」再磕一下，「……飞鸿，你清醒一点。」

旁白：你清了清嗓子。他猛地回头，一秒切换成无事发生：「我没事。我就是……就是来背歌词的。」
选项：
- 「背歌词需要拿头磕墙吗？」（大旗+2）
- 「我什么都没看见。」（憋笑离开）（记住push1）（大旗+3）

【cp_06｜大旗56｜团建 · 巴士】
旁白：就这样，又过了一段时间。乐团外出团建，大巴去邻市。宝石晕车，一上车就坐到了第一排靠窗。飞鸿晚几个站才上车，拎着两袋零食，上车第一眼就找到了那个靠窗的脑袋。

飞鸿：（走到宝石旁边，刚要开口：）「晕车吗——」

旁白：话音未落，雪子从前门上了车，步子轻快，径直坐在了宝石旁边的空位上：「巧了，我也晕车，咱俩正好作伴。」

旁白：飞鸿僵在过道里。你看见他的手在半空停了停，最终转身坐到了后排——全程目视前方，一动不动，像一座装了发动机的雕塑。

旁白：回程时天色晚了，雪子去了后排跟大塔聊天。飞鸿立刻起身，在宝石旁边坐下，动作快得像抢拍的鼓点。宝石迷迷糊糊睁开眼：「你没晕车呀？」飞鸿把外套披到他肩上：「睡了就闭嘴。」
选项：
- （坐他们后排，全程姨母笑）（大旗+2）
- （对十元发消息：「旗要成了」）（记住push2）（大旗+3）

【cp_07｜大旗64｜悸动 · 摩天轮】
旁白：歌友会大获成功。散场后十元提议去坐摩天轮，说要「团建收尾」。然后她拉着你和众人，在轿厢分配上做了这辈子最精彩的一次调度——宝石和飞鸿，单独一个轿厢。

旁白：你隔着玻璃看见：小小的轿厢里，宝石贴着窗看夜景，飞鸿看着他。城市的灯一点点升上来，落到两个人的眼睛里。

旁白：下来的时候，宝石的脸有点红，说是闷的。飞鸿走在他后面半步，手一直虚虚地护在他身后，护了一路，什么也没碰。

十元：（凑过来跟你咬耳朵，眼睛亮晶晶：）「看到没有！那个半步！那个虚护！」
选项：
- 「我看到了！大旗我来扛！」（记住push2）（大旗+4）
- （拍照留念）（大旗+2）

【cp_08｜大旗72｜挑明前夜 · 递刀】
旁白：歌友会之后，飞鸿变得很奇怪。他排练老走神，看宝石的眼神像看一道解不出来的和弦。周四深夜，他把你约到山丘后门，抽了半根烟——他不会抽，呛得直咳嗽。

飞鸿：（终于开口：）「我受不了了。」他盯着自己的鞋尖，「雪子天天在他旁边，他还傻乎乎地什么都感觉不到。我……我想跟他挑明。」

旁白：他抬起头，眼睛里全是血丝，和一点不肯承认的怕。

飞鸿：「你帮我看看，我机会大吗？」
选项：
- 「大。他现在离不开你，只是不知道那叫什么。」（记住push3）（大旗+3）（去cp_08b）
- 「万一说了连朋友都做不成呢？」（去cp_08c）

【cp_08b｜副场景｜】
旁白：飞鸿深吸一口气，点了点头：「那我就说了。输也输个明白。」

旁白：他转身要走，又回头，很认真地补了一句：「到时候不管成不成，都谢谢你——这段时间，全团就你在真心帮我们。」
选项：
- 「加油。」（大旗+2）

【cp_08c｜副场景｜】

<script>
/* ================= 解析器与引擎（程序维护区） ================= */
var SAVE_KEY='cp_route_v2';
var WHO={'旁白':'sys','十元':'shiyuan','飞鸿':'feihong','宝石':'baoshi','雪子':'xuezi','大塔':'data','大羊':'dayang'};
var NAME={sys:'旁白',shiyuan:'十元',feihong:'飞鸿',baoshi:'宝石',xuezi:'雪子',data:'大塔',dayang:'大羊'};
var G={cp:10,level:4,flags:{},done:{}};

function parseScript(txt){
 var raw=txt.split('\n'),blocks=[],cur=[];
 for(var ri=0;ri<raw.length;ri++){var L=raw[ri];
  if(!L.trim()){
   var nxt=null;
   for(var rj=ri+1;rj<raw.length;rj++){if(raw[rj].trim()){nxt=raw[rj].trim();break;}}
   if(nxt&&nxt.charAt(0)==='【'){blocks.push(cur.join('\n'));cur=[];}
   else cur.push(L);
  }else cur.push(L);
 }
 blocks.push(cur.join('\n'));
 var route=[];
 blocks.forEach(function(b){
  b=b.trim();if(!b)return;
  var lines=b.split('\n'),head=lines[0].match(/^【(.+?)】/);
  if(!head)return;
  var parts=head[1].split('｜');
  var ev={id:parts[0].trim(),sub:false,need:{},title:(parts[2]||'').trim(),lines:[],choices:null};
  (parts[1]||'').split(' ').forEach(function(c){
   c=c.trim();if(!c)return;
   if(c==='副场景')ev.sub=true;
   else if(c.indexOf('大旗')===0)ev.need.cp=parseInt(c.slice(2))||0;
   else if(c.indexOf('旗标')===0)ev.need[c.slice(2)]=1;
  });
  var mode='text';
  for(var i=1;i<lines.length;i++){
   var L=lines[i].trim();if(!L)continue;
   if(L==='选项：'){mode='choice';ev.choices=[];continue;}
   if(mode==='choice'&&L.charAt(0)==='-'){
    var t=L.replace(/^-\s*/,'');
    var c={t:'',aff:{},flag:null,flags:[],next:null};
    while(true){
     var mm=t.match(/（([^（）]*)）\s*$/);
     if(!mm)break;
     var inner=mm[1].trim(),used=true;
     var nm=inner.match(/^(?:大旗|羁绊|好感)([+-])(\d+)$/);
     if(nm)c.aff.cp=(nm[1]==='-'?-1:1)*(parseInt(nm[2])||0);
     else if(inner.indexOf('记住')===0)c.flags.push(inner.slice(2));
     else if(inner.indexOf('去')===0)c.next=inner.slice(1).trim();
     else used=false;
     if(!used)break;
     t=t.slice(0,mm.index).trim();
    }
    c.t=t;ev.choices.push(c);continue;}
   var mi=L.match(/^(.+?)：([\s\S]*)$/);
   if(mi&&WHO[mi[1]]){ev.lines.push({who:WHO[mi[1]],text:mi[2]});}
  }
  route.push(ev);
 });
 return route;
}
var ROUTE=parseScript(document.getElementById('script').value);

function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(G));}
function load(){var s=localStorage.getItem(SAVE_KEY);if(s){try{G=JSON.parse(s);return true}catch(e){}}return false;}
var el=function(id){return document.getElementById(id)};
function hud(){var h='<span>大旗值 '+G.cp+'</span><span>乐队Lv.'+G.level+'</span>';
 for(var k in G.flags)if(k.charAt(0)!=='_')h+='<span class="flag">◆'+k+'</span>';el('hud').innerHTML=h;}
function render(ev){hud();G.cur=ev.id;save();
 var m='<div class="panel">';
 if(ev.title)m+='<div class="ins" style="margin-top:0">'+ev.title+'</div>';
 ev.lines.forEach(function(l){m+='<div class="who">'+NAME[l.who]+'</div><div class="txt">'+l.text+'</div>';});
 if(ev.choices){ev.choices.forEach(function(c,i){m+='<button class="btn" onclick="pick('+i+')">'+c.t+'</button>';});}
 else{m+='<button class="btn" onclick="pick(0)">（继续）</button>';}
 m+='</div>';el('main').innerHTML=m;el('main')._ev=ev;}
function pick(i){G.done[G.cur]=1;var ev=el('main')._ev;
 var c=ev.choices?ev.choices[i]:null;
 if(c){if(c.aff)for(var k in c.aff)G.cp+=(c.aff[k]||0);
  if(c.flags)c.flags.forEach(function(f){G.flags[f]=1;});
  if(c.flag)G.flags[c.flag]=1;
  if(c.next){var nx=ROUTE.find(function(e){return e.id===c.next;});if(nx){render(nx);return;}}}
 idle();}
function nextEvent(){for(var i=0;i<ROUTE.length;i++){var e=ROUTE[i];
  if(e.id===G.cur||G.done[e.id]||e.sub)continue;
  if(e.id==='cp_00'&&(G.level<6||!G.flags.feiSide))continue;
  if(check(e.need)){render(e);return true;}}
 return false;}
function idle(){
 if(G.cp>=95&&!G.flags._done){
  G.flags._done=1;
  var n=['push1','push2','push3','push4'].filter(function(f){return G.flags[f];}).length;
  var tgt=n>=3?'cp_HE':'cp_BE';
  var ev=ROUTE.find(function(e){return e.id===tgt;});if(ev){render(ev);return;}}
 if(nextEvent())return;
 if(G.level>=6&&!G.flags.feiSide&&!G.flags._hint){
  G.flags._hint=1;
  el('main').innerHTML='<div class="panel"><div class="txt">你的乐队等级已经够了，但这条线还进不去。<br><br>宝石×飞鸿线需要两个前置：① 第一章飞鸿被雪子挤兑时，你站出来替他说过话（旗标 feiSide）；② 从十元线分流而来——在十元的表白节点选择「不表白，只说我们继续一起组乐团吧」。<br><br>（调试：点下方按钮直接获得前置）</div><button class="btn" onclick="G.flags.feiSide=1;G.flags.syFriend=1;save();idle()">获得前置（调试用）</button></div>';return;}
 var m='<div class="panel"><div class="ins" style="margin-top:0">事件之间 · 自由行动</div>';
 if(G.level<6)m+='<button class="btn" onclick="doGig()">答应十元的演出邀约（乐队等级+1，Lv.6 解锁本线）</button>';
 m+='<button class="btn" onclick="G.cp+=2;save();idle()">山丘旁听排练（大旗+2）</button>';
 m+='<button class="btn" onclick="G.cp+=5;save();idle()">大旗 +5（调试用）</button>';
 m+='<button class="btn" onclick="if(confirm(\'清空存档重来？\')){localStorage.removeItem(SAVE_KEY);location.reload();}">清空重来</button></div>';
 el('main').innerHTML=m;}
function doGig(){G.level++;hud();save();
 el('main').innerHTML='<div class="panel"><div class="who">十元</div><div class="txt">「演出拜托啦！」（乐队等级 +1，当前 Lv.'+G.level+'）</div><button class="btn" onclick="idle()">（继续）</button></div>';}
function check(need){if(!need)return true;for(var k in need){if(k==='cp'){if(G.cp<need[k])return false;}else if(!G.flags[k])return false;}return true;}
window.onload=function(){load();idle();};
window.pick=pick;window.G=G;window.idle=idle;window.doGig=doGig;
</script>
