【yc_start｜开篇 · 咸鱼的五月】
旁白：你是一个大学生，读自媒体运营。专业课你坐在倒数第二排——倒数第一排睡觉的那位，是你室友。

旁白：你的人生信条是「差不多就行」：作业差不多就行，恋爱差不多就行，未来……未来到时候再说。

旁白：直到五月，学校要求实习证明，家里催你找兼职。你在小蓝书上刷到一个叫十元的女生，头像是一只抱着贝斯的猫。她说：「来我们乐团实习吧，什么都干的那种。」

旁白：五月第一天，你推开 GUSHI 排练室的门。旧木地板，满墙的海报，空气里是音箱底噪的电流声和外卖咖啡的味道。

旁白：钢琴前坐着的人十指翻飞在弹李斯特，表情却像在做作业——那是大鹅。角落里一个人把同一段布鲁斯音阶弹了二十遍，一遍比一遍慢——大羊。鼓凳上的人拿绒布擦镲片，擦得比敲得还认真，腕上一串手串随着动作轻轻作响——小塔。门口冲进来一个，贝斯包还滴着雨——REK。还有两个人在追逐打闹，嘴里喊着谁也听不懂的口号——宝石和飞鸿。

十元：（她把你拉到中间，拍手：）「都停一下！新实习生，今后海报、摇人、后勤、挨骂，都归他。」

大羊：（头也不抬：）「实习生？先说好，我的效果器不许碰。」

小塔：（推了推墨镜，递给你一张打印表：）「这是排练考勤表，以后麻烦你登记。精确到分钟。」

REK：（一屁股坐下：）「大学生啊。你们实习有钱拿吗？……哦，没有啊。那挺惨的。」

宝石：（凑过来，笑嘻嘻：）「在吗？V我50。」

飞鸿：（一把把他拽回去：）「别理他。他见谁都这么说。」

大鹅：（最后才从琴凳上转过身，冲你点点头，声音很轻：）「……欢迎。」

旁白：你站在原地，忽然意识到：这个团，好像没人打算「差不多就行」。
选项：
- 掏出手机：「那……先加个微信吧，都加。」（记住wx_all）（去yc_may1）
- 先加大鹅的微信（记住wx_ge）（去yc_may1）
- 先加大羊的微信（记住wx_dy）（去yc_may1）
- 先加小塔的微信（记住wx_ta）（去yc_may1）
- 先加REK的微信（记住wx_aq）（去yc_may1）
- 先加宝石的微信（记住wx_ba）（去yc_may1）
- 先加飞鸿的微信（记住wx_fh）（去yc_may1）

【yc_may1｜五月 · 实习生的第一道题】
旁白：第一个任务来得很快。十元发来消息：月底歌友会，海报归你。ddl 是后天。

旁白：以前的你会怎么做，你心里有数：套个模板，换个字体，交差，祈祷没人细看。

十元：（电话里：）「预算没有，要求很多。要年轻，要有梗，要让人看了想来。你看着办。」

你：（你盯着空白的画布看了两个小时，弹幕一样飘过去的全是借口：我又不是学设计的……）

旁白：凌晨一点，排练室群里还在聊编曲。你看着那些消息，忽然有点不好意思把一张糊弄的海报发进去。
选项：
- 熬一夜，一笔一笔从头做，做到自己满意为止（记住mayTry）（担当+5）（去yc_may2）
- 套个高级模板，改改字，反正没人细看（担当-3）（去yc_may2）

【yc_may2｜五月 · 交卷】
旁白：海报发进群里的那一刻，你盯着屏幕，心跳得比等期末成绩还快。

小塔：「时间表、地址、票价，都对。二维码能扫。」

大羊：「哟，这个排版，比之前那版强多了。」

宝石：「已转发。配文：在？来看演出。」

十元：（她最后出现，只回了四个字：）「留着用吧。」

旁白：你后来才知道，「留着用吧」是十元的最高评价。那一晚你睡得格外踏实——原来把一件事做完，是这种感觉。
选项：
- （五月结束，翻开通讯录）（去NEXT）

【yc_jun1｜六月 · 530之夜】
旁白：六月，530 专场前一周，大鹅、十元和柒柒在山丘排练到深夜。你被叫去搬设备，搬完就留下来听。

旁白：柒柒是十元的朋友，做活动策划，说话永远带着笑，笑得让你想起商场里恰到好处的灯光。

旁白：散场时，一桌客人认出了大鹅，起哄着要他喝一杯「润润嗓子」。一杯接着一杯。大鹅笑着，耳根通红，手指在桌下绞着谱子边角。

大鹅：（小声，几乎听不见：）「我……真的不太能喝……」

客人：「哎——最后一杯！音乐人怎么能不给面子！」

旁白：十元去结账了。柒柒坐在旁边，笑盈盈地看着，没有阻止的意思。以前的你会低头刷手机，假装这桌跟你没关系。
选项：
- 走过去，端起那杯替大鹅挡下：「这杯我替他。」（记住geBlock）（担当+4）（去yc_jun2）
- 拉起大鹅就走：「他明早八点有录音，制作人是我。」（记住geSave）（担当+3）（去yc_jun2）
- 站着没动。多一事不如少一事。（担当-4）（去yc_jun2b）

【yc_jun2b｜六月 · 袖手】
旁白：你低头刷了三分钟手机。再抬头时，大鹅已经被按回椅子上，那杯酒见了底。

旁白：他趴在桌上，冲你摆了摆手，意思是你先回。那一摆，摆得你心里发空。

旁白：（你告诉自己这不关你的事。但那一晚，你睡得不太好。）
选项：
- 「……下次不会了。」（去yc_jun2）

【yc_jun2｜六月 · 留下的】
旁白：散场前，大鹅到底还是被灌了几杯——「最后一杯！」客人喊得理直气壮。

旁白：柒柒这时才站起来，冲你笑了笑，那笑容温柔得没有缝隙。

柒柒：「你先回去吧。我来照顾他就可以了。」

大鹅：（醉意上来，含混地：）「实习生……你先回……我没事……」

旁白：你点点头，往门口走。手握上门把的那一刻，你停住了——他说「没事」的样子，和白天说「欢迎」的样子，判若两人。
选项：
- 带上门，真的离开，把今晚的事原原本本告诉十元（记住junTell）（去yc_jun4）
- 带上门，把脚步声踩远，再悄悄折回来（记住junStay）（去yc_jun3）

【yc_jun3｜六月 · 看见的】
旁白：你轻轻带上门，故意把脚步声踩得越来越远，然后脱了鞋，折回来，把自己塞进走廊转角那摞设备箱后面。

旁白：几秒钟后，包间的门开了一条缝。柒柒探出头，扫了一眼空无一人的走廊，满意地关了门。

旁白：你从设备箱的缝隙里看进去：她确实在照顾大鹅——递水、递纸巾、轻声细语，滴水不漏。

旁白：然后你看见她拿出手机，对着醉意朦胧的大鹅拍了几张照片，低头编辑着什么，嘴角带着笑。

旁白：三秒后，她把手机收好，继续温柔地照顾他。一切都很好。只是你说不清哪里不对。

旁白：（你把看到的每一个细节，都记在了心里。）
选项：
- 「……先记下来。」（去yc_jun4）

【yc_jun4｜六月 · 提醒】
旁白：第二天中午，大鹅在群里发了个「昨晚谢谢柒柒」的表情包。柒柒回了个笑脸。

旁白：你盯着那个笑脸看了很久。昨晚的事，说，还是不说？说了像挑拨，不说像共谋。

十元：（私信你：）「昨晚我没在。你觉得柒柒这个人怎么样？随便聊聊。」
选项：
- 把看到的拍照细节告诉十元：「我说不上来，但你最好知道。」（记住junWarn）（担当+3）（去NEXT）
- 「挺好的啊，很会照顾人。」多一事不如少一事。（担当-2）（去NEXT）

【yc_jul1｜七月 · 路演救场】
旁白：七月第一场路演，状况百出：音响啸叫、谱架被风掀翻，最要命的——鼓手的位置空着。小塔家里有事，请了两个小时的假。

大羊：（压着火：）「没有鼓，我们演什么？演阿卡贝拉吗？」

REK：「要不我贝斯打节奏？我手脚并用。」

宝石：「我可以用嘴。噗呲——啪——」

飞鸿：「你给我闭嘴。」

旁白：开场前十分钟，小塔冲了回来，头发滴水，衬衫都没来得及换，一看就是从公司直接杀过来的。他什么都没说，坐上去，第一槌落下，全团的心都定了。

旁白：你看见他的手在抖。不是累的，是家里的事还没办完。
选项：
- 递上毛巾和水，什么都不问，顺手帮他把鼓凳调到习惯的高度（记住taLike）（担当+3）（去yc_jul2）
- 追问：「家里没事吧？要不要帮忙？」（去yc_jul2）

【yc_jul2｜七月 · 实习任务包】
旁白：七月，你的实习任务正式落地：海报、摇人帖、后勤清单，三件套全归你。十元把一沓皱巴巴的资料拍在你面前。

十元：「以前这些都是我熬夜做的。现在归你了。做砸了，我在歌友会上当众念你的检讨。」

你：「……做砸的标准是？」

十元：（她想了想：）「让观众觉得我们是个草台班子。——虽然我们确实是，但不能让人看出来。」
选项：
- 海报：自己熬夜做一版，风格延续五月那张（记住jbA）（去yc_jul3）
- 海报：找学设计的室友帮忙，你负责请客（记住jbB）（去yc_jul3）

【yc_jul3｜七月 · 摇人帖】
旁白：海报定了。接下来是小蓝书摇人帖。十元的要求是九个字：「要年轻，要有梗，要让人想来。」

旁白：你翻遍了热门帖子，做了三版草稿。写到第三版的时候你忽然明白：所谓「梗」，不过是把「我们很认真」说成「我们很好玩」。
选项：
- 发玩梗版：「在？来听一场不许划手机的演出」（记住yrA）（去yc_jul4）
- 发正经版：演出信息、曲目单、乐手介绍（记住yrB）（去yc_jul4）

【yc_jul4｜七月 · 后勤清单】
旁白：最后是后勤：设备、备用弦、饮用水、急救包、雨天的塑料布、给观众的防蚊贴。

小塔：（路过看了一眼你的清单：）「备用弦备两套。上个月大羊断弦，全场等他换了七分钟。」

大羊：（在角落抗议：）「七分钟怎么了！那叫中场互动！」

旁白：你把「备用弦×2」加粗标红。你忽然发现，自己的清单已经不是「差不多就行」的样子了。
选项：
- 逐项核对，多备两套备用弦，加上防雨布和急救包（记住hqA）（担当+2）（去NEXT）
- 大概列个单子，差不多就行（记住hqB）（担当-2）（去NEXT）

【yc_aug1｜八月 · 微妙的两个人】
旁白：八月，你开始察觉宝石和飞鸿之间的微妙：练歌间隙，宝石的水杯总是满的——但没人看见是谁添的。飞鸿扒好的谱子，总是「顺手」放在宝石最顺手的位置。

旁白：而两个人一见面，又开始为一句和声争得面红耳赤。

宝石：「这个和声应该上行！上行才有那种——那种飞起来的感觉！」

飞鸿：「下行。下行才稳。你那个飞法，听众的耳朵会晕机。」

宝石：「你就是不懂浪漫！」

飞鸿：「你就是不懂乐理！」

旁白：团里的人都看出来了。都装没看出来。十元用胳膊肘捅了捅你。

十元：（小声：）「实习生，你说这事……要不要推一把？」
选项：
- 组个饭局，故意把两个人的座位排在一起（记住cpPush）（去yc_aug2）
- 装没看见。感情的事，外人掺和只会越帮越忙。（去yc_aug2）

【yc_aug2｜八月 · 假弹风波】
旁白：八月中，大鹅接到一个好机会——电视台的青年音乐会直播，一段键盘独奏。酬劳不高，但曝光难得。直播前三天，他退出了。

旁白：原因后来才传开：节目组要求全场假弹，放录音对口型，理由是「直播不能出事故」。大鹅在群里发了很长一段话，最后一句是：

大鹅：「我可以弹错，但不能对着镜头假装自己在弹。那是直播，不是演戏。」

旁白：节目组把他的退出公告写得阴阳怪气，字里行间都是「某键盘手缺乏职业精神」。有营销号跟进，评论区乌烟瘴气。群里吵成一团。

REK：（在群里发了一串省略号：）「……这圈子，什么时候连真弹都成错了。」

十元：（私信你：）「你去看看他。他现在谁的消息都不回。」
选项：
- 去琴房找大鹅，当面把话说开（记住geHold）（去yc_aug3）
- 在群里发声明，把假弹的聊天记录整理成时间线（记住gePost）（担当+4）（去yc_aug4）

【yc_aug3｜八月 · 挽留】
旁白：你在琴房找到大鹅。他坐在钢琴前，没弹琴，就坐着。谱架上摊着一张音乐会的节目单，被揉皱了又抚平。

大鹅：（他抬头看你，眼睛红红的，却努力装出大人的样子：）「我没事。你回去吧，群里还需要你。」

你：「群里的事我处理完了。现在轮到你的事。」

 '宝石':[{f:'cpPush',t:'宝石：「那顿饭……座位是你安排的吧？谢、谢、你、哦。（咬牙切齿，又有点暗爽）」'},
  {f:'splitNo',t:'宝石：「名单上有我们的名字。我听说了，是你争的。……我不知道说什么，给你写首歌吧。」'},
  {f:'splitYes',t:'宝石：「……没事，我理解，比赛要紧。真的。……真的。」（他连发了三个真的）'}],
 '飞鸿':[{f:'cpPush',t:'飞鸿：「饭局那天，他多吃了半碗饭。……座位是你排的吧。谢谢。」'},
  {f:'splitNo',t:'飞鸿：「报名表我看到了。名字在中间。……这份情，我和宝石都记着。」'}],
 '小周':[{f:'standTA',t:'小周：「你当场把我表哥那点算盘掀了……说实话，我有点解脱。那事我拦不住，你拦住了。」'},
  {f:'standSoft',t:'小周：「场地那事，你私下提醒塔哥，没撕破脸。……换我做不到这么体面。」'},
  {f:'oct4',t:'小周：「群里那次，谢谢你把话摊开说。阴阳怪气这毛病，我在改。真的在改。」'}]};
function parseScript(txt){
 var raw=txt.split('\n'),blocks=[],cur=[];
 for(var ri=0;ri<raw.length;ri++){var L=raw[ri];
  if(!L.trim()){
   var nxt=null;
   for(var rj=ri+1;rj<raw.length;rj++){if(raw[rj].trim()){nxt=raw[rj].trim();break;}}
   if(nxt&&nxt.charAt(0)==='【'){blocks.push(cur.join('\n'));cur=[];}
   else cur.push(L);
  }else cur.push(L);
 }
 blocks.push(cur.join('\n'));
 var route=[];
 blocks.forEach(function(b){
  b=b.trim();if(!b)return;
  var lines=b.split('\n'),head=lines[0].match(/^【(.+?)】/);
  if(!head)return;
  var parts=head[1].split('｜');
  var ev={id:parts[0].trim(),title:(parts[1]||'').trim(),lines:[],choices:null};
  var mode='text';
  for(var i=1;i<lines.length;i++){
   var L=lines[i].trim();if(!L)continue;
   if(L==='选项：'){mode='choice';ev.choices=[];continue;}
   if(mode==='choice'&&L.charAt(0)==='-'){
    var t=L.replace(/^-\s*/,'');
    var c={t:'',aff:{},flags:[],dang:0,next:null};
    while(true){
     var mm=t.match(/（([^（）]*)）\s*$/);
     if(!mm)break;
     var inner=mm[1].trim(),used=true;
     var nm=inner.match(/^分([+-])(\d+)$/);
     if(nm)c.aff.score=(nm[1]==='-'?-1:1)*(parseInt(nm[2])||0);
     else if(inner.indexOf('担当')===0){var dm=inner.match(/^担当([+-]\d+)$/);if(dm)c.dang=parseInt(dm[1]);else used=false;}
     else if(inner.indexOf('好感')===0){var mm2=inner.match(/好感(\S+?)([+-]\d+)/);if(mm2)c.aff['a_'+mm2[1]]=parseInt(mm2[2]);else used=false;}
     else if(inner.indexOf('记住')===0)c.flags.push(inner.slice(2));
     else if(inner.indexOf('去')===0)c.next=inner.slice(1).trim();
     else used=false;
     if(!used)break;
     t=t.slice(0,mm.index).trim();
    }
    c.t=t;ev.choices.push(c);continue;}
   var mi=L.match(/^(.+?)：([\s\S]*)$/);
   if(mi&&WHO[mi[1]]){ev.lines.push({who:WHO[mi[1]],text:mi[2]});}
  }
  route.push(ev);
 });
 return route;
}
var ROUTE=parseScript(document.getElementById('script').value);
var ENDS={yc_end1:1,yc_end2:1,yc_end3:1,yc_end4:1}; /* 恋爱线HE后接乐队决赛，乐队结算才是最终章 */
function findEv(id){return ROUTE.find(function(e){return e.id===id;});}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));}catch(e){}}
function load(){try{var s=localStorage.getItem(SAVE_KEY);if(s){var o=JSON.parse(s);if(o&&typeof o.done==='object'){G=o;return true;}}}catch(e){}return false;}
var el=function(id){return document.getElementById(id)};
function dots(){var d='';for(var i=0;i<8;i++){d+='<i class="'+(i<G.month+1?'on':'')+(i===G.month+1?'':'')+'"></i>';}
 /* 8 段：五月 + 六~十一月 + 十二月 */
 var cur=Math.min(G.month,7);d='';
 for(var j=0;j<8;j++){d+='<i class="'+(j<cur?'on':(j===cur?'now':''))+'"></i>';}
 el('dots').innerHTML=d;}
function hud(){var h='<span>乐队积分 '+G.score+'</span><span class="grow">担当值 '+G.dang+'</span>';
 G.names.forEach(function(n){if(G.aff[n])h+='<span>'+n+' '+G.aff[n]+'</span>';});
 el('hud').innerHTML=h;dots();}
/* 走过角色线/CP线后，乐队最终章开头会提一嘴那条线的剧情 */
var LINE_EPILOGUE={
 '大鹅':'礼花还没落尽，你望向琴房的方向。那个写了四十遍才发出去的句子，和今晚一样——都是终于鼓起勇气，发出去的东西。',
 '大羊':'散场时，有人举杯碰了碰你的杯子，什么都没解释，就说了三个字：「敬破例。」',
 'REK':'散场后 REK 发来消息：「我表哥问，决赛录像有没有。」你笑了。人生赢家的路，才刚开始。',
 '小塔':'散场时你摸了摸口袋里那张画——背面的电话号码，和整片整片的蓝。缘分这东西，说来就来。',
 '小周':'散场时小周发来消息：「票没白给吧。」你回：没白给。仓库的门，也没白开。',
 'cp':'你看着漫天礼花，突然明白了：陪伴是最长情的告白。宝石飞鸿的故事，永远未完待续……'};
function render(ev){hud();G.cur=ev.id;save();
 var m='<div class="panel">';
 if(ev.title)m+='<div class="ins">'+ev.title+'</div>';
 var lines=ev.lines;
 if(ENDS[ev.id]&&G.flags._line&&LINE_EPILOGUE[G.flags._line]){
  lines=[{who:'sys',text:LINE_EPILOGUE[G.flags._line]}].concat(lines);
  G.flags._line=0;save();
 }
 lines.forEach(function(l){m+='<div class="'+l.who+'"><div class="who">'+NAME[l.who]+'</div><div class="txt">'+l.text+'</div></div>';});
 var chs=ev.choices;
 /* 观察点：去过的地方不再出现，避免原地打转 */
 if(['yc_cp5a','yc_cp5b','yc_cp5c'].indexOf(ev.id)>=0&&chs){
  chs=chs.filter(function(c){return !(c.next&&G.done[c.next]);});
  if(!chs.length)chs=ev.choices.slice(-1);
 }
 ev._c=chs;
 if(chs){chs.forEach(function(c,i){m+='<button class="btn" onclick="pick('+i+')">'+c.t+'</button>';});}
 else{m+='<button class="btn" onclick="pick(0)">（继续）</button>';}
 m+='</div>';el('main').innerHTML=m;el('main')._ev=ev;window.scrollTo(0,0);}
function applyC(c){
 if(c.aff){for(var k in c.aff){if(k==='score')G.score+=c.aff[k];else G.aff[k.slice(2)]=(G.aff[k.slice(2)]||0)+c.aff[k];}}
 if(c.dang)G.dang+=c.dang;
 c.flags.forEach(function(f){
  G.flags[f]=1;
  if(f==='wx_all'){G.names.forEach(function(n){if(n!=='小周')G.wx[n]=1;});} /* 小周九月才入团 */
  else if(WXMAP[f]){G.wx[WXMAP[f]]=1;}
 });
 /* 事件分值 */
 var F={mayTry:6,geBlock:3,geSave:4,junTell:2,junStay:4,junWarn:3,taLike:4,jbA:8,jbB:5,yrA:8,yrB:5,hqA:7,hqB:4,
  cpPush:8,gePost:6,rainSave:8,sepOk:6,standTA:10,standSoft:5,splitNo:40,splitYes:-100,
  oct1:4,oct2:4,oct3:4,oct4:4,prFix:10,prCold:-5,novAll:8};
 c.flags.forEach(function(f){if(F[f])G.score+=F[f];});
 if(c.flags.indexOf('geHold')>=0)G.aff['大鹅']=(G.aff['大鹅']||0)+10;
}
function pick(i){G.done[G.cur]=1;var ev=el('main')._ev;
 var chs=ev._c||ev.choices;
 var c=(chs&&chs[i])?chs[i]:null;
 if(c){applyC(c);
  if(c.next==='NEXT'){pool();return;}
  if(c.next==='RESULT'){bandResult();return;}
  if(c.next==='yc_nov2_auto'){render(findEv(G.flags.splitYes?'yc_nov2b':'yc_nov2'));return;}
  if(c.next==='yc_dec_band_auto'){render(findEv(G.flags.splitYes?'yc_dec_band2':'yc_dec_band'));return;}
  if(c.next){var nx=findEv(c.next);if(nx){render(nx);return;}}}
 if(ENDS[G.cur]){G.flags._ended=1;save();
  var grow=G.dang>=25?'从咸鱼到主心骨，你把「差不多就行」活成了「交给我就行」。':(G.dang>=10?'你不再是那个只想摸鱼的实习生了——至少，没人再把你当实习生看。':'也许下一次，你会更愿意往前站一步。');
  el('main').innerHTML='<div class="panel"><div class="endmark">—— 羊村线 · 已完结 ——</div><div class="txt" style="text-align:center;color:#cfc6b6">乐队积分 '+G.score+' · 担当值 '+G.dang+'<br>'+grow+'</div><button class="btn pri" onclick="restart()">重新开始</button></div>';return;}
 pool();}
function restart(){if(confirm('清空存档、从头开始？')){try{localStorage.removeItem(SAVE_KEY);}catch(e){}location.reload();}}
function nextMonth(){
 if(G.month<MONTHS.length){var e=findEv(MONTHS[G.month][0]);G.month++;save();if(e){render(e);return;}}
 /* 十一月分流：宝石飞鸿好感合计≥100 → CP线（优先） */
 if(((G.aff['宝石']||0)+(G.aff['飞鸿']||0))>=100){var ec=findEv('yc_cp1');if(ec){G.flags._line='cp';render(ec);return;}}
 var best=null,bv=0;G.names.forEach(function(n){var v=G.aff[n]||0;if(v>bv){bv=v;best=n;}});
 if(bv>50){var map={'大鹅':'yc_ge1','大羊':'yc_dy1','REK':'yc_aq1','小塔':'yc_ta1','小周':'yc_zhou1'};
  var e2=findEv(map[best]);if(e2){G.flags._line=best;render(e2);return;}}
 var e3=findEv(G.flags.splitYes?'yc_dec_band2':'yc_dec_band');if(e3)render(e3);}
function bandResult(){
 var s=G.score;
 var tgt=s>=95?'yc_end1':(s>=90?'yc_end2':(s>=80?'yc_end3':'yc_end4'));
 var e=findEv(tgt);if(e)render(e);}
var ADD_LINES={
 '大鹅':'你端着两杯咖啡凑到琴房门口：「那个……加个微信？以后排练通知方便发。」大鹅愣了一下，掏出手机：「好。……其实我早就想加你了。」',
 '大羊':'你趁他调音的间隙递上二维码。大羊扫完挑眉：「早干嘛去了？」顿了顿又补一句，「加了就好。以后效果器的事，问你。」',
 '小塔':'你刚开口，小塔已经把手机递过来了：「我正想找你。考勤表以后线上同步给你。」——他的好友申请附言精确到了标点符号。',
 'REK':'REK大手一挥：「加！早该加了！」扫完码他盯着你头像看了三秒：「这头像不行，改天我帮你拍一张，我有摄影天赋。」',
 '宝石':'宝石秒通过，第一句话是：「在吗？V我50。」你回了个问号，他回：「破冰仪式。现在你算自己人了。」',
 '飞鸿':'飞鸿安静地扫了码，安静地通过，安静地发来一份他刚扒好的谱子：「以后谱子直接发你。」——他的社交礼仪全在文件传输里。',
 '小周':'小周看到你的好友申请，明显愣了一下，通过得飞快。半分钟后他发来一句：「……谢谢。」你问谢什么，他再没回。'};
function addWx(i){var n=G.names[i];
 if(G.wx[n]||(n==='小周'&&G.month<4)){pool();return;}
 G.wx[n]=1;G.aff[n]=(G.aff[n]||0)+2;
 hud();save();el('main')._ev=null;
 el('main').innerHTML='<div class="panel"><div class="ins">新的联系人 · '+n+'</div><div class="txt">'+ADD_LINES[n]+'<br><span style="color:var(--gold2);font-size:13px">（已添加微信，破冰好感 +2）</span></div><button class="btn" onclick="pool()">（回到通讯录）</button></div>';}
function pool(){
 var label=POOL_LABELS[Math.min(G.month,POOL_LABELS.length-1)];
 var left=4-(G.spent[G.month]||0);
 var m='<div class="panel"><div class="ins">'+label+' · 微信</div><div class="txt" style="color:#cfc6b6">今晚找谁聊天？（本月还可聊 '+left+' 次）</div>';
 G.names.forEach(function(n,i){
  if(n==='小周'&&G.month<4)return; /* 小周九月才入团 */
  if(G.wx[n])m+='<button class="btn" onclick="chatN('+i+')">'+n+'（好感 '+(G.aff[n]||0)+'）</button>';
  else m+='<button class="btn" style="border-style:dashed" onclick="addWx('+i+')">＋ 加 '+n+' 的微信</button>';
 });
 m+='<button class="btn pri" onclick="nextMonth()">（进入下个月）</button></div>';
 el('main').innerHTML=m;el('main')._ev=null;hud();}
function chatN(i){var n=G.names[i];
 if((G.spent[G.month]||0)>=4||(n==='小周'&&G.month<4)){pool();return;}
 G.spent[G.month]=(G.spent[G.month]||0)+1;G.aff[n]=(G.aff[n]||0)+5;
 var li,bonus='（好感 +5）';
 G.seenC=G.seenC||{};G.seenR=G.seenR||{};
 /* 1. 剧情回响优先：你做过的事，他会主动提起 */
 var reacts=(REACT_LINES[n]||[]).filter(function(r){return G.flags[r.f]&&!(G.seenR[n]&&G.seenR[n][r.f]);});
 if(reacts.length){
  var r=reacts[Math.floor(Math.random()*reacts.length)];li=r.t;
  G.seenR[n]=G.seenR[n]||{};G.seenR[n][r.f]=1;
  bonus='✦ 回响 '+bonus;
 }else{
  /* 2. 随机事件（同样不重复，全触发过才重置） */
  var evs=chatAvail(RANDOM_EVENTS[n]);
  var seenE=G.seenC[n]||[];
  var evsNew=evs.filter(function(x){return seenE.indexOf(x.t)<0;});
  if(evsNew.length&&Math.random()<0.4){
   var e=evsNew[Math.floor(Math.random()*evsNew.length)];li=e.t;
   (G.seenC[n]=G.seenC[n]||[]).push(e.t);
   if(e.aff){G.aff[n]+=e.aff;bonus+='，额外好感 +'+e.aff;}
   if(e.dang){G.dang+=e.dang;bonus+='，担当 +'+e.dang;}
   if(e.score){G.score+=e.score;bonus+='，乐队积分 +'+e.score;}
   bonus='✦ 随机事件 '+bonus;
  }else{
   /* 3. 日常+月度对话：不重复；聊完进入深夜长聊保底；全聊完才重置 */
   var lines=chatAvail(CHAT_LINES[n]).concat(chatAvail(MONTH_LINES[n]));
   var seen=G.seenC[n]||[];
   var avail=lines.filter(function(x){return seen.indexOf(x.t)<0;});
   if(!avail.length){
    var cont=(CONT_LINES[n]||[]).filter(function(t){return seen.indexOf(t)<0;});
    if(cont.length){avail=cont.map(function(t){return {t:t};});}
    else{G.seenC[n]=[];avail=lines.length?lines:[{t:'聊了几句。'}];}
   }
   var p=avail[Math.floor(Math.random()*avail.length)];
   (G.seenC[n]=G.seenC[n]||[]).push(p.t);li=p.t;
  }
 }
 hud();save();el('main')._ev=null;
 el('main').innerHTML='<div class="panel"><div class="ins">微信 · '+n+'</div><div class="txt">'+li+'<br><span style="color:var(--gold2);font-size:13px">'+bonus+'</span></div><button class="btn" onclick="pool()">（回到通讯录）</button></div>';}
window.onload=function(){load();
 if(G.flags&&G.flags._ended){try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  G={score:0,dang:0,aff:{},wx:{},month:0,flags:{},done:{},spent:{},names:G.names};}
 hud();
 if(G._started&&G.cur&&findEv(G.cur)&&!ENDS[G.cur]){render(findEv(G.cur));}
 else if(G._started){pool();}
 else{G._started=1;save();render(findEv('yc_start')||ROUTE[0]);}};
window.pick=pick;window.G=G;window.pool=pool;window.chatN=chatN;window.nextMonth=nextMonth;window.restart=restart;window.addWx=addWx;
</script>
