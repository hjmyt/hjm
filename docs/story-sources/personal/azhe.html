旁白：路演前两小时，你路过琴房，听见水声。

旁白：阿喆站在洗手台前，面前摆着五个塑料盒。他一颗一颗洗着葡萄和圣女果，洗得极认真，像在擦自己的琴。听到脚步声，他慌忙把盒子往包里塞：「啊、你怎么来了。」

【azhe_01d｜副场景｜】

旁白：深夜的排练室，你听见一段没听过的旋律。阿喆一个人坐在角落练琴，没有谱，闭着眼。琴声的脾气很奇怪——前半段像在问一个问题，后半段像在等一个回答。

- （继续）

- （继续）（好感-1）

【azhe_06｜好感66｜第六幕 · 星光落在谱架上】
旁白：剧场演出的那晚，你在侧幕等上场。灯光暗下前，你余光瞥见阿喆抱着你的谱子走过来——他把每一页的谱角都贴了小标签，按顺序排好，还在容易翻乱的第三页夹了荧光条。

旁白：「第三页胶水有点松，我加固了。」他把谱子递给你，语气像在汇报工作，「今天风大，舞台边的谱架我压了沙袋。你别担心，专心拉。」

旁白：整场演出，你没有一次低头找谱。每一次抬眼，谱子永远停在该在的那一页。谢幕的掌声响起时，你回头找他——他站在控制台边，比你还紧张，拳头攥着，指节都白了。看到你望过来，他才松开手，冲你用力点头。

【azhe_06b｜副场景｜】
旁白：你穿过人群走向他。他还站在原地，像被钉住了。「……零失误。」他先开口，「今天翻谱，零失误。」顿了顿，又补一句：「我是说，我零失误。你拉得……也很好。」

旁白：剧场的灯一盏盏暗下去，只有穹顶的星光装饰还亮着，落在他的肩膀上。他忽然说：「其实刚才你在台上的时候，我一直在想——」他停住了，耳朵尖慢慢红透，「……没什么。你饿不饿？后台有水果，我洗过了。」
选项：
- 「你又洗水果了。」（笑）（好感+4）（记住starlight）（去azhe_06e）
- 「你刚才想说什么？」（好感+3）（记住starlight）（去azhe_06e）

【azhe_06c｜副场景｜】
旁白：你站在原地。他像是挣扎了很久，终于穿过人群向你走来，在离你一步的地方停下。星光从穹顶落下来，落在他的睫毛上。

阿喆：「今天的星光，」他看着天，声音很轻，「比排练室的灯好看。」（顿了很久）「跟你一起看的话——更好看。」

旁白：说完这句话，他像是用完了全身的力气，眼神飘向别处，手却诚实地没有走。你看见他的手在微微发抖——和他每次翻谱前试页边时一样稳，又一样抖。
选项：
- （伸手，握住他发抖的手）（好感+4）（记住starlight）（去azhe_06e）
- 「阿喆，我也是这么觉得的。」（好感+3）（记住starlight）（去azhe_06e）

【azhe_06e｜副场景｜】
阿喆：（他没有抽回手，也没有更进一步，只是站着，像守着一页不敢翻的谱。过了很久，他小声说：）「……这页我能不能，先不翻。」

旁白：你懂他的意思。有些话一旦说破，就没有回头页了。星光下你们站了很久，久到保洁阿姨开始扫地。走的时候，他把你送到琴房楼下，从包里摸出一盒洗好的草莓：「今晚的。……晚安。」
选项：
- （抱着草莓上楼）（好感+3）

【azhe_07｜好感72 旗标starlight｜第七幕 · 杭州的 offer】
旁白：周一，阿喆来得比谁都早。你的谱架上没有谱，只有一杯还冒热气的豆浆——不加糖。你上个月随口说过一次「豆浆不加糖才好喝」，连你自己都忘了。

旁白：他的琴盒立在脚边，扣得严严实实。那是他紧张时才有的小动作。

阿喆：「我要走了。」他说得很平静，像在念别人的事，「杭州。家里托了关系，一家乐团附属的音乐机构，有编制，有宿舍，五险一金。」他扯了扯嘴角，「我妈说，搞音乐的，也要吃饭。」

旁白：排练室很静。你听见自己的心跳，比任何一次演出前都响。
选项：
- 「什么时候走？」（好感+2）（去azhe_07b）
- 「你……想好了吗？」（好感+2）（去azhe_07b）
- 「哦。挺好的。」（去azhe_07b）

阿喆：「下周。」他终于抬起头看你，「我纠结了一整个周末。本来想……星光那晚就说的。没敢说。」他深吸一口气，像是把最后一页谱攥在了手心，「现在说了。你，怎么想？」
选项：
- 「我跟你去杭州。」（记住goHZ）（去azhe_TE）
- 「我留下。哈基米需要我，你也需要更大的舞台。」（记住stay）（去azhe_08）

【azhe_TE｜副场景｜TE · 同行的方向】
旁白：你辞掉了这边的一切。走的那天，十元在站台上哭得稀里哗啦，塞给你两盒洗好的水果：「杭州的场子要是欺负你们，就回来！没你不行！」

旁白：杭州的生活比想象中难，也比想象中亮。阿喆白天在机构上班，晚上在出租屋的小阳台上给你翻谱——这次，是你找工作的面试稿，他也一页一页贴了标签。

旁白：两年后，你们在钱塘江边租了一个带琴房的两居室。阳台很小，刚好放两把椅子。某个周末的傍晚，他洗了一盒葡萄，递给你最满的那盒：「这盒甜。」和当年一模一样。

旁白：你偶尔会想起哈基米，想起剧场穹顶的星光。阿喆从身后抱住你：「等攒够了钱，我们回去看演出。买最好的位置——不，买侧幕，侧幕看得清翻谱的人。」

旁白：—— TE · 同行的方向 ——（你们在一起了。只是哈基米的谱架上，从此少了一双最稳的手。）
选项：
- —— 阿喆线 · TE 完 ——

【azhe_08｜副场景｜两年】
旁白：你们没有说再见。约定是：每周三视频，每月一封信，谁的演出，另一个能来就来。

旁白：异地恋比想象中难。有时视频里他累得说不出话，有时你演出失利不想说话。但每周三晚上八点，屏幕一定会亮。他给你看他的宿舍、食堂、杭州的雨；你给他看排练室的新谱架、冰冰的新琴、十元又拉了哪首《小星星》。

旁白：第一年，他春节没回来，寄了一盒杭州的糕点，盒底压着一张手写谱——那首《已清洗，可直接食用》的完整版，最后一页是空的，只写了一行字：「这一页，等我们一起写。」

旁白：第二年，哈基米接到了剧场的巡演邀请，做大做强。首演那晚，你在侧幕看到一个熟悉的身影——他拎着琴盒，风尘仆仆，冲着目瞪口呆的你扬了扬手里的水果盒：「这盒甜。……我请了年假。以后每次演出，我都来翻谱。」

【azhe_HE｜副场景｜HE · 星光落回剧场】

旁白：首场巡演的那个剧场，穹顶的星光和那天一模一样。演出结束，观众散尽，他牵着你的手走到舞台中央，从琴盒里取出那本手写的谱子——《已清洗，可直接食用》，最后一页不再是空的。

旁白：那一页写着你的名字。下面还有一行小字：「已确认，可直接演奏一辈子。」

旁白：他单膝跪下去的时候还在紧张，台词说得颠三倒四，戒指是从琴盒的暗格里拿的——藏了整整两个月。你哭着说「好」的时候，他如释重负地笑了：「这页……我终于敢翻了。」

<script>
/* ================= 剧本解析器与引擎（程序维护区） ================= */
var SAVE_KEY='azhe_route_full_v1';
var WHO={'阿喆':'azhe','TIM':'tim','冰冰':'bingbing','垃垃':'lala','十元':'shiyuan','旁白':'sys'};
var NAME={azhe:'阿喆',tim:'TIM',bingbing:'冰冰',lala:'垃垃',shiyuan:'十元',sys:'旁白'};
var G={azhe:20,flags:{},done:{},duet:0};

function parseScript(txt){
 var raw=txt.split('\n'),blocks=[],cur=[];
 for(var ri=0;ri<raw.length;ri++){var L=raw[ri];
  if(!L.trim()){
   var nxt=null;
   for(var rj=ri+1;rj<raw.length;rj++){if(raw[rj].trim()){nxt=raw[rj].trim();break;}}
   if(nxt&&nxt.charAt(0)==='【'){blocks.push(cur.join('\n'));cur=[];}
   else cur.push(L);
  }else cur.push(L);
 }
 blocks.push(cur.join('\n'));
 var route=[];
 blocks.forEach(function(b){
  b=b.trim();if(!b)return;
  var lines=b.split('\n'),head=lines[0].match(/^【(.+?)】/);
  if(!head)return;
  var parts=head[1].split('｜');
  var ev={id:parts[0].trim(),sub:false,need:{},title:(parts[2]||'').trim(),lines:[],choices:null};
  (parts[1]||'').split(' ').forEach(function(c){
   c=c.trim();if(!c)return;
   if(c==='副场景')ev.sub=true;
   else if(c.indexOf('好感')===0)ev.need.azhe=parseInt(c.slice(2))||0;
   else if(c.indexOf('旗标')===0)ev.need[c.slice(2)]=1;
  });
  var mode='text';
  for(var i=1;i<lines.length;i++){
   var L=lines[i].trim();if(!L)continue;
   if(L==='选项：'){mode='choice';ev.choices=[];continue;}
   if(mode==='choice'&&L.charAt(0)==='-'){
    var m=L.match(/^-\s*(.+?)(?:（(.+)）)?$/);
    var c={t:m[1],aff:{},flag:null,next:null};
    if(m[2]){m[2].split('）（').join('|').split('）|').join('|').split('|').forEach(function(p){
      p=p.trim().replace(/[（）]/g,'');
      if(p.indexOf('好感+')===0)c.aff.azhe=parseInt(p.slice(3))||0;
      else if(p.indexOf('记住')===0)c.flag=p.slice(2);
      else if(p.indexOf('去')===0)c.next=p.slice(1);
     });}
    ev.choices.push(c);continue;}
   var mi=L.match(/^(.+?)：([\s\S]*)$/);
   if(mi&&WHO[mi[1]]){ev.lines.push({who:WHO[mi[1]],text:mi[2]});}
  }
  route.push(ev);
 });
 return route;
}
var ROUTE=parseScript(document.getElementById('script').value);

/* 聊天（连续合奏2次解锁；不同选项不同好感） */
var CHATS=[
 {id:'foodMap',who:'azhe',title:'巷子里的小店',
  text:'阿喆：「排练完别走。」他带你拐进琴房后面的小巷，一家没有招牌的面馆。「老板娘认识我，」他得意地挑眉，「多加一份笋，不要香菜——你上次挑出来了，我记得。」',
  choices:[
   {t:'「你连这个都记得？」',aff:{azhe:3},flag:'foodMap'},
   {t:'「还行，凑合。」',aff:{azhe:1}}]},
 {id:'careful',who:'azhe',title:'他记得一切',
  text:'旁白：你发现阿喆的备忘录里有一页叫「团内事项」。你的那一栏写着：不吃香菜、弱音器在琴盒第二层、演出前会紧张要留独处时间、豆浆不加糖。最后一行是最近补的：周三晚上八点，别约她。',
  choices:[
   {t:'「周三晚上八点，为什么别约我？」',aff:{azhe:3},flag:'careful'},
   {t:'（假装没看到，心跳如鼓）',aff:{azhe:2}}]},
 {id:'tape',who:'azhe',title:'直男礼物',
  text:'阿喆：「给你的。」他递过来一个包装得像炸药包的东西。拆开是一整箱护指胶带，附赠一张打印的对比测评表：各品牌粘性、透气性、价格，以及最后一栏手写备注——「她拉得久，这个不伤手」。',
  choices:[
   {t:'「……你做了测评表？」（笑出声）',aff:{azhe:3},flag:'tape'},
   {t:'「谢谢，很实用。」',aff:{azhe:1}}]},
 {id:'duetChat',who:'azhe',title:'下次一起',
  text:'阿喆：「下次合奏，」他状似不经意地整理谱架，「你把第三页那段再稳一稳。我不是说你拉得不好——我是说，我想跟你一起把它拉好。」',
  choices:[
   {t:'「好啊，下次一起。」',aff:{azhe:2}},
   {t:'「你先把自己的翻谱练好吧。」（怼他）',aff:{azhe:1}}]}
];

function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(G));}
function load(){var s=localStorage.getItem(SAVE_KEY);if(s){try{G=JSON.parse(s);return true}catch(e){}}return false;}
var el=function(id){return document.getElementById(id)};
function hud(){var h='<span>阿喆好感 '+G.azhe+'</span><span>合奏 '+G.duet+' 次</span>';
 for(var k in G.flags)h+='<span class="flag">◆'+k+'</span>';el('hud').innerHTML=h;}
function render(ev){hud();G.cur=ev.id;save();
 var m='<div class="panel">';
 if(ev.title)m+='<div class="ins" style="margin-top:0">'+ev.title+'</div>';
 ev.lines.forEach(function(l){m+='<div class="who">'+NAME[l.who]+'</div><div class="txt">'+l.text+'</div>';});
 if(ev.choices){ev.choices.forEach(function(c,i){m+='<button class="btn" onclick="pick('+i+')">'+c.t+'</button>';});}
 else{m+='<button class="btn" onclick="pick(0)">（继续）</button>';}
 m+='</div>';el('main').innerHTML=m;el('main')._ev=ev;}
function pick(i){G.done[G.cur]=1;var ev=el('main')._ev;
 var c=ev.choices?ev.choices[i]:null;
 if(c){if(c.aff)for(var k in c.aff)G.azhe+=(c.aff[k]||0);
  if(c.flag)G.flags[c.flag]=1;
  if(c.next){var nx=ROUTE.find(function(e){return e.id===c.next;});if(nx){render(nx);return;}}}
 idle();}
function nextEvent(){for(var i=0;i<ROUTE.length;i++){var e=ROUTE[i];
  if(e.id===G.cur||G.done[e.id]||e.sub)continue;
  if(check(e.need)){render(e);return true;}}
 return false;}
function idle(){
 /* 特殊拦截：无星光旗标却达到72好感 → 无星光版第七幕 */
 if((G.azhe||0)>=72&&!G.flags.starlight&&!G.flags.stay&&!G.flags.goHZ&&!G.done['azhe_BE_note']){
  G.flags.beNote=1;var be=ROUTE.find(function(e){return e.id==='azhe_BE_note'});if(be){render(be);return;}}
 if(nextEvent())return;
 /* 动作面板：合奏 / 聊天 / 调试 */
 var m='<div class="panel"><div class="ins" style="margin-top:0">事件之间 · 自由行动</div>';
 m+='<button class="btn" onclick="doDuet()">和阿喆合奏一场（好感+2）</button>';
 if(G.flags.duet2)m+='<button class="btn" onclick="chatAzhe()">找阿喆聊天</button>';
 else m+='<button class="btn" style="opacity:.55">找阿喆聊天（再合奏 '+(2-G.duet)+' 次解锁）</button>';
 m+='<button class="btn" onclick="G.azhe+=5;save();idle()">好感 +5（调试用）</button>';
 m+='<button class="btn" onclick="if(confirm(\'清空存档重来？\')){localStorage.removeItem(SAVE_KEY);location.reload();}">清空重来</button></div>';
 el('main').innerHTML=m;}
function doDuet(){G.duet++;G.azhe+=2;if(G.duet>=2)G.flags.duet2=1;hud();save();
 el('main').innerHTML='<div class="panel"><div class="who">阿喆</div><div class="txt">「这段再来一遍。」阿喆帮你翻着谱，「你今天的手感，比昨天好。」（好感 +2）</div><button class="btn" onclick="idle()">（继续）</button></div>';}
var chatIdx=0;
function chatAzhe(){var c=CHATS[chatIdx%CHATS.length];chatIdx++;
 if(G.flags[c.id]&&chatIdx%CHATS.length===0){}
 render({id:'chat_'+c.id,title:'日常 · '+c.title,lines:[{who:c.who,text:c.text}],choices:c.choices.concat()});
 el('main')._chat=true;}
var _origPick=pick;
pick=function(i){if(el('main')._chat){el('main')._chat=false;_origPick(i);return;}_origPick(i);};
function check(need){if(!need)return true;for(var k in need){if(k==='azhe'){if(G.azhe<need[k])return false;}else if(!G.flags[k])return false;}return true;}
window.onload=function(){load();idle();};
window.pick=pick;window.G=G;window.idle=idle;window.doDuet=doDuet;window.chatAzhe=chatAzhe;
</script>
</body>
