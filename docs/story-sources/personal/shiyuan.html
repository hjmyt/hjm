旁白：—— HE · 光源向你 ——（这一次，换她走向你。）
选项：
- —— 十元线 · HE 完 ——

【sy_TE｜副场景｜TE · 团长与乐团】
旁白：你表白了。十元没有拒绝，也没有答应。她只是很认真地说：「让我想想。这一次，我想想清楚——为我自己想清楚。」

旁白：后来她把全部的力气都给了乐团。哈基米越来越好，好到她的名字出现在每一张海报的最前面。偶尔在庆功宴上碰杯，她还是会笑着说「没你不行」——只是这一次，你懂了，那真的是「团员」的意思。

旁白：—— TE · 团长与乐团 ——
选项：
- —— 十元线 · TE 完 ——

【sy_BE_ge｜副场景｜BE · 传出去的话】
旁白：你还是去找了大鹅。开门见山：「团里都在传——你喜不喜欢十元？」

大鹅：（他怔了一下，随即笑了，笑得意味不明：）「哈？我怎么会喜欢她那种人呢。」他摆摆手，「别闹了。」

旁白：你以为这就是答案，转身走了。你没有看见，你身后，大鹅盯着你的背影看了很久——然后掏出手机，在群里发了一条消息。

旁白：三天后，十元看你的眼神变了。她还是笑着，只是不再单独叫你的名字。垃垃欲言又止，最终只问了半句：「你……去找过大鹅？」

十元：（走廊里擦肩而过，她停下来，背对着你说：）「我没什么好被人打听的。」

旁白：那句话传遍了团里，越传越变形。你试图解释，可连解释本身，都成了新的谈资。

十元：（最后一次开口，是在排练室门口。她没有看你：）「对不起。我们还是……保持距离吧。」

旁白：—— BE · 传出去的话 ——（有些话，说出口的那一刻，就不归你了。）
选项：
- —— 十元线 · BE 完 ——

【sy_TE2｜副场景｜TE · 双城】
旁白：你终究没有陪她考那一场星海。她也没有停下——有人替她规划了路线，有人替她找了老师，有人陪她在琴房坐到深夜。她考上那天，朋友圈的照片里，星海校门的灯很亮。

旁白：两年后，你们的乐团巡演到广州。演出结束，你在后台看见她——她站在走廊那头，身边还是那个永远体面的身影。

旁白：她冲你挥手，笑得和从前一样：「没你不行呀。」你还是笑了。只是你知道，「没你不行」这四个字，从此有很多种说法。

旁白：—— TE · 双城 ——（深圳到广州，一百四十七公里。你们谁都没有提，当年那道乐理题，是谁替她答的。）
选项：
- —— 十元线 · TE 完 ——

【sy_BE｜副场景｜BE · 最棒的团员】
旁白：你表白了。十元愣了两秒，然后轻轻地、温柔地笑了。

十元：「……谢谢你。」她说，「你是我最棒的团员。真的。没你不行——但我说的「没你不行」，是乐团的那种。」

旁白：她的温柔比任何拒绝都锋利。那天之后你还是她的{{inst}}手，还是她口中最可靠的伙伴。只是你终于明白：光源照亮所有人，而你，站得离光太近了，忘了问自己配不配。

旁白：—— BE · 最棒的团员 ——（羁绊不足时表白，请勿在好感不够时按 A。）
选项：

<script>
/* ================= 剧本解析器与引擎（程序维护区） ================= */
var SAVE_KEY='sy_route_v5';
var WHO={'阿喆':'azhe','TIM':'tim','冰冰':'bingbing','垃垃':'lala','十元':'shiyuan','旁白':'sys','小塔':'xiaota','大鹅':'dage','大羊':'dayang','黄奕兴':'huangyx','朱老师':'zhulaoshi'};
var NAME={azhe:'阿喆',tim:'TIM',bingbing:'冰冰',lala:'垃垃',shiyuan:'十元',sys:'旁白',xiaota:'小塔',dage:'大鹅',dayang:'大羊',huangyx:'黄奕兴',zhulaoshi:'朱老师'};
var G={shiyuan:12,flags:{},done:{},acts:0};

function parseScript(txt){
 var raw=txt.split('\n'),blocks=[],cur=[];
 for(var ri=0;ri<raw.length;ri++){var L=raw[ri];
  if(!L.trim()){
   var nxt=null;
   for(var rj=ri+1;rj<raw.length;rj++){if(raw[rj].trim()){nxt=raw[rj].trim();break;}}
   if(nxt&&nxt.charAt(0)==='【'){blocks.push(cur.join('\n'));cur=[];}
   else cur.push(L);
  }else cur.push(L);
 }
 blocks.push(cur.join('\n'));
 var route=[];
 blocks.forEach(function(b){
  b=b.trim();if(!b)return;
  var lines=b.split('\n'),head=lines[0].match(/^【(.+?)】/);
  if(!head)return;
  var parts=head[1].split('｜');
  var ev={id:parts[0].trim(),sub:false,need:{},title:(parts[2]||'').trim(),lines:[],choices:null};
  (parts[1]||'').split(' ').forEach(function(c){
   c=c.trim();if(!c)return;
   if(c==='副场景')ev.sub=true;
   else if(c.indexOf('羁绊')===0||c.indexOf('好感')===0)ev.need.shiyuan=parseInt(c.slice(2))||0;
   else if(c.indexOf('旗标')===0)ev.need[c.slice(2)]=1;
  });
  var mode='text';
  for(var i=1;i<lines.length;i++){
   var L=lines[i].trim();if(!L)continue;
   if(L==='选项：'){mode='choice';ev.choices=[];continue;}
      if(mode==='choice'&&L.charAt(0)==='-'){
    var t=L.replace(/^-\s*/,'');
    var c={t:'',aff:{},flag:null,flags:[],next:null};
    while(true){
     var mm=t.match(/（([^（）]*)）\s*$/);
     if(!mm)break;
     var inner=mm[1].trim(),used=true;
     var nm=inner.match(/^(?:羁绊|好感)([+-])(\d+)$/);
     if(nm)c.aff.shiyuan=(nm[1]==='-'?-1:1)*(parseInt(nm[2])||0);
     else if(inner.indexOf('记住')===0)c.flags.push(inner.slice(2));
     else if(inner.indexOf('去')===0)c.next=inner.slice(1).trim();
     else used=false;
     if(!used)break;
     t=t.slice(0,mm.index).trim();
    }
    c.t=t;ev.choices.push(c);continue;}
   var mi=L.match(/^(.+?)：([\s\S]*)$/);
   if(mi&&WHO[mi[1]]){ev.lines.push({who:WHO[mi[1]],text:mi[2]});}
  }
  route.push(ev);
 });
 return route;
}
var ROUTE=parseScript(document.getElementById('script').value);

function tpl(t){return t.replace(/\{\{inst\}\}/g,G.inst||'小提琴');}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(G));}
function load(){var s=localStorage.getItem(SAVE_KEY);if(s){try{G=JSON.parse(s);return true}catch(e){}}return false;}
var el=function(id){return document.getElementById(id)};
function hud(){var h='<span>十元羁绊 '+G.shiyuan+'</span><span>事业心 '+Math.min(3,(G.focus||0))+'/3</span>';
 for(var k in G.flags)h+='<span class="flag">◆'+k+'</span>';el('hud').innerHTML=h;}
function render(ev){hud();G.cur=ev.id;var qs={'sy_q1':1,'sy_i1':2,'sy_q2':3,'sy_i2':4,'sy_q3':5,'sy_i3':6};if(qs[ev.id])G.qstage=qs[ev.id];save();
 var m='<div class="panel">';
 if(ev.title)m+='<div class="ins" style="margin-top:0">'+ev.title+'</div>';
 ev.lines.forEach(function(l){m+='<div class="who">'+NAME[l.who]+'</div><div class="txt">'+tpl(l.text)+'</div>';});
 if(ev.choices){ev.choices.forEach(function(c,i){m+='<button class="btn" onclick="pick('+i+')">'+tpl(c.t)+'</button>';});}
 else{m+='<button class="btn" onclick="pick(0)">（继续）</button>';}
 m+='</div>';el('main').innerHTML=m;el('main')._ev=ev;}
function pick(i){G.done[G.cur]=1;var ev=el('main')._ev;
 var c=ev.choices?ev.choices[i]:null;
 if(c){if(c.aff)for(var k in c.aff)G.shiyuan+=(c.aff[k]||0);
  if(c.flags)c.flags.forEach(function(f){G.flags[f]=1;});if(c.flag)G.flags[c.flag]=1;
  if(c.next==='ACT_DONE'){idle();return;}
  if(c.next==='REPLY'){var r=prompt('回复十元的动态（20字以内）：')||'一起向前冲！';r=r.slice(0,20);
   el('main').innerHTML='<div class="panel"><div class="who">你</div><div class="txt">你回复：「'+r+'」</div><div class="ins">十元秒回了三个感叹号，外加一个冲拳的表情。</div><button class="btn" onclick="idle()">（继续）</button></div>';return;}
  if(c.next==='QNEXT'){var seq=['sy_i1','sy_q2','sy_i2','sy_q3','sy_i3','sy_qdone'];var n=G.qstage||1;var t3=(n>=6)?'sy_qdone':seq[n-1];var e6=ROUTE.find(function(e){return e.id===t3;});if(e6){render(e6);return;}idle();return;}
  if(c.next==='CHK_COMFORT'){var t=G.shiyuan>=65?'sy_04c_ok':'sy_04c_ye';var ev2=ROUTE.find(function(e){return e.id===t;});if(ev2){render(ev2);return;}idle();return;}
  if(c.next){var nx=ROUTE.find(function(e){return e.id===c.next;});if(nx){render(nx);return;}}
  if(ENDS[G.cur]){G.flags._ended=1;save();endPage();return;}}
 idle();}
function nextEvent(){for(var i=0;i<ROUTE.length;i++){var e=ROUTE[i];
  if(e.id===G.cur||G.done[e.id]||e.sub)continue;
  if(check(e.need)){render(e);return true;}}
 return false;}
var ENDS={sy_HE:1,sy_TE:1,sy_TE2:1,sy_BE:1,sy_BE_ge:1};
function endPage(){
 el('main').innerHTML='<div class="panel"><div class="ins" style="margin-top:0">—— 十元线 · 已完结 ——</div><div class="txt">这个结局已经走到头了。<br>想改命的话，从头再来一遍吧——这一次，试试别的选项。</div><button class="btn" onclick="if(confirm(\'清空存档、从头开始？\')){localStorage.removeItem(SAVE_KEY);location.reload();}">重新开始</button><button class="btn" onclick="endPage2()">留在结局页</button></div>';}
function endPage2(){el('main').innerHTML='<div class="panel"><div class="txt">结局页。感谢游玩。</div></div>';}
function idle(){
 if(G.flags._ended){return;}
 /* 引擎判定：表白分流 */
 if(G.flags.confessed&&!G.flags._confDone){
  G.flags._confDone=1;
  var ok=G.flags.soul&&G.flags.pdHelp&&G.flags.examHelp&&G.flags.q1&&G.flags.q2&&G.flags.q3&&(G.focus||0)>=3&&G.flags.startup;
  var tgt=ok?'sy_HE':(G.flags.examHelp?'sy_TE':'sy_TE2');
  G.done['sy_10']=1;
  var ev=ROUTE.find(function(e){return e.id===tgt;});if(ev){render(ev);return;}}
 if(nextEvent())return;
 var m='<div class="panel"><div class="ins" style="margin-top:0">事件之间 · 自由行动</div>';
 m+='<button class="btn" onclick="doPractice()">刻苦练琴（羁绊+10，可能收到十元的邀约）</button>';
 m+='<button class="btn" onclick="G.shiyuan+=10;save();idle()">羁绊 +10（调试用）</button>';
 m+='<button class="btn" onclick="if(confirm(\'清空存档重来？\')){localStorage.removeItem(SAVE_KEY);location.reload();}">清空重来</button></div>';
 el('main').innerHTML=m;}
function doPractice(){
 G.shiyuan+=10;G.focus=(G.focus||0)+1;
 var ask=G.acts%3;
 G.acts++;
 var acts=[['商场商演','乐队缺人，商场商演凑个场？','sy_act1'],['小乐队排练','朋友攒了个小乐队，来玩吗？','sy_act2'],['老乐手小聚','周末老乐手小聚，一起？','sy_act3']];
 var a=acts[ask];hud();save();
 var m='<div class="panel"><div class="who">十元</div><div class="txt">「{{inst}}手！'+a[1]+'」（接受邀约：羁绊再 +10）</div>';
 m+='<button class="btn" onclick="doAct(\''+a[2]+'\')">「好啊，我去。」</button>';
 m+='<button class="btn" onclick="idle()">「这周有点累，下次吧。」（羁绊+10已入账）</button></div>';
 el('main').innerHTML=tpl(m);}
function doAct(id){G.shiyuan+=10;G.actAcc=(G.actAcc||0)+1;if(G.actAcc>=2)G.flags.acts2=1;var ev=ROUTE.find(function(e){return e.id===id;});if(ev)render(ev);else idle();}
function check(need){if(!need)return true;for(var k in need){if(k==='shiyuan'){if(G.shiyuan<need[k])return false;}else if(k.indexOf('|')>=0){var ok=k.split('|').some(function(f){return G.flags[f];});if(!ok)return false;}else if(!G.flags[k])return false;}return true;}
window.onload=function(){load();idle();};
window.pick=pick;window.G=G;window.idle=idle;window.doPractice=doPractice;window.doAct=doAct;
</script>
